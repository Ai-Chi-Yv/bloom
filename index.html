<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Herbloom 女性健康管家</title>
<style>
/* Herbloom H5 - Global Styles */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f6f8; color: #333; overflow-x: hidden; }
body { min-height: 100vh; padding-top: 50px; padding-bottom: 70px; }
button { border: none; background: none; cursor: pointer; font-family: inherit; color: inherit; }
input, textarea { font-family: inherit; outline: none; border: none; }
a { color: inherit; text-decoration: none; }

/* ===== NavBar ===== */
.nav-bar {
  position: fixed; top: 0; left: 0; right: 0; height: 50px;
  background: #fff; z-index: 100;
  display: flex; align-items: center;
  border-bottom: 1px solid #eee;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.nav-title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; color: #333; }
.nav-back { width: 44px; height: 50px; font-size: 28px; color: #666; line-height: 50px; padding: 0 12px; }
.nav-action { padding: 0 16px; font-size: 14px; color: #d43f6e; }

/* ===== TabBar ===== */
.tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
  background: #fff; z-index: 100;
  display: flex;
  border-top: 1px solid #eee;
  box-shadow: 0 -1px 4px rgba(0,0,0,0.04);
}
.tab-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; padding: 6px 0;
  color: #999; font-size: 11px; transition: color 0.2s;
}
.tab-item.active { color: #ffb6c1; }
.tab-icon { font-size: 22px; line-height: 1; }
.tab-text { font-size: 11px; }

/* ===== Toast ===== */
.toast {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.75); color: #fff; padding: 12px 24px;
  border-radius: 8px; font-size: 14px; z-index: 1000;
  max-width: 80%; text-align: center;
}

/* ===== Modal ===== */
.modal {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); z-index: 200;
  display: flex; align-items: center; justify-content: center;
}
.modal-box {
  background: #fff; border-radius: 12px; width: 85%; max-width: 320px;
  overflow: hidden;
}
.modal-title { padding: 18px 16px 8px; font-size: 16px; font-weight: 600; text-align: center; }
.modal-content { padding: 0 16px 16px; font-size: 14px; color: #666; line-height: 1.6; }
.modal-actions { display: flex; border-top: 1px solid #eee; }
.modal-cancel, .modal-confirm {
  flex: 1; padding: 12px 0; font-size: 15px; background: none;
}
.modal-cancel { color: #666; border-right: 1px solid #eee; }
.modal-confirm { color: #d43f6e; font-weight: 600; }

/* ===== AI Float ===== */
.ai-float {
  position: fixed; right: 16px; bottom: 80px; width: 48px; height: 48px;
  background: linear-gradient(135deg, #ff8fab, #d4607f);
  border-radius: 50%; box-shadow: 0 4px 16px rgba(212,96,127,0.4);
  display: flex; align-items: center; justify-content: center;
  z-index: 99; animation: floatBounce 3s ease-in-out infinite;
}
.ai-float-icon { font-size: 24px; }
@keyframes floatBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

/* ===== Common ===== */
.page { padding: 10px 16px; min-height: calc(100vh - 110px); }
.section-title { font-size: 15px; font-weight: 600; margin: 10px 0; color: #333; }
.card {
  background: #fff; border-radius: 12px; padding: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 10px;
}
.btn {
  display: inline-block; background: linear-gradient(135deg, #ffb6c1, #ff8fab);
  color: #fff; border-radius: 24px; padding: 10px 24px; font-size: 14px;
  font-weight: 600; text-align: center; border: none;
}
.btn-outline { background: #fff; color: #d43f6e; border: 1px solid #ffb6c1; }
.btn-block { display: block; width: 100%; }

/* Badge / Tag */
.tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; margin: 2px; }
.tag-pink { background: #ffe8ee; color: #d43f6e; }
.tag-gray { background: #f0f0f0; color: #666; }

/* ===== Period Page ===== */
.period-container { background: #fff5fa; min-height: 100%; padding: 10px; }
.period-header { display: flex; justify-content: center; align-items: center; padding: 8px 0; position: relative; }
.period-month { font-size: 18px; font-weight: 600; color: #333; margin: 0 20px; }
.period-arrow { font-size: 18px; color: #666; padding: 4px 12px; }
.period-banner {
  background: linear-gradient(135deg, #fff0f5, #ffe4ec);
  border-left: 4px solid #ffb6c1; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
}
.phase-info { display: flex; gap: 6px; margin-bottom: 4px; }
.phase-label { font-size: 12px; color: #999; }
.phase-name { font-size: 14px; font-weight: 600; color: #d4607f; }
.phase-desc { font-size: 12px; color: #888; line-height: 1.5; }
.irregular-banner {
  background: #fff8e8; border-left: 4px solid #ffa502; border-radius: 8px;
  padding: 10px 12px; margin-bottom: 8px;
}
.irregular-title { font-size: 13px; font-weight: 600; color: #e67e22; display: block; margin-bottom: 4px; }
.irregular-desc { font-size: 12px; color: #888; line-height: 1.5; white-space: pre-wrap; }

/* Calendar */
.calendar { background: #fff; border-radius: 12px; padding: 10px 4px; margin-bottom: 10px; }
.weekdays { display: flex; margin-bottom: 4px; }
.weekdays span { flex: 1; text-align: center; color: #d4607f; font-size: 12px; font-weight: 600; padding: 4px 0; }
.days { display: flex; flex-wrap: wrap; }
.day {
  width: 14.28%; aspect-ratio: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; position: relative;
  font-size: 13px; color: #333; cursor: pointer; border-radius: 50%;
}
.day.other { color: #d0d0d0; }
.day.today .dn { color: #e0485f; font-weight: 700; }
.day.selected { background: #fff0f5; color: #d4607f; font-weight: 600; }
.dn { font-size: 13px; line-height: 1; }
.dot { position: absolute; bottom: 2px; width: 6px; height: 6px; border-radius: 50%; }
.dot.period { background: #ff6b8a; box-shadow: 0 0 4px rgba(255,107,138,0.5); }
.dot.predict { background: #ffb6c1; border: 1px solid #ff6b8a; }
.dot.ovulation { background: #5b9bd5; }
.dot.ovday { background: #9b59b6; }
.legend { display: flex; justify-content: center; gap: 12px; margin-top: 6px; padding-top: 6px; border-top: 1px solid #f5f5f5; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; font-size: 10px; color: #aaa; gap: 3px; }
.lg { width: 7px; height: 7px; border-radius: 50%; }
.lg.p { background: #ff6b8a; } .lg.pp { border: 1px dashed #ffb6c1; } .lg.o { background: #5b9bd5; } .lg.od { background: #9b59b6; }

/* Record section */
.record-section { background: #fcf1f1; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.record-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0e0e0; }
.record-item:last-child { border-bottom: none; }
.record-label { width: 50px; font-size: 13px; font-weight: 600; color: #555; }
.record-value { flex: 1; text-align: right; font-size: 13px; color: #666; }
.record-row { display: flex; gap: 6px; justify-content: flex-end; flex: 1; }
.flow-btn, .pain-btn { width: 24px; height: 24px; border-radius: 50%; background: #ffe8ee; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.flow-btn.active, .pain-btn.active { background: #ff6b8a; color: #fff; }
.symptoms-list { flex: 1; text-align: right; font-size: 12px; color: #666; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }

/* Prediction card */
.prediction { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.prediction-title { font-size: 14px; font-weight: 600; text-align: center; margin-bottom: 10px; color: #333; }
.prediction-stats { display: flex; justify-content: space-around; border-bottom: 1px solid #f5f5f5; padding-bottom: 10px; margin-bottom: 10px; }
.stat-col { display: flex; flex-direction: column; align-items: center; }
.stat-num { font-size: 20px; font-weight: 700; color: #d4607f; }
.stat-lbl { font-size: 11px; color: #999; margin-top: 2px; }
.pred-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
.pred-lbl { color: #666; }
.pred-val { font-weight: 600; }
.pred-val.period { color: #d4607f; }
.pred-val.ovulation { color: #5b9bd5; }
.pred-val.ovday { color: #9b59b6; }
.trend { background: #fdf6f8; border-radius: 8px; padding: 8px 10px; margin-top: 8px; text-align: center; }
.trend-lbl { font-size: 11px; color: #999; display: block; margin-bottom: 4px; }
.trend-items { display: flex; justify-content: center; gap: 12px; font-size: 12px; color: #d4607f; font-weight: 600; }

/* Health advice */
.health-advice {
  background: linear-gradient(135deg, #fffef7, #fff8e8);
  border-radius: 12px; padding: 14px; margin-bottom: 20px;
}
.advice-title { font-size: 14px; font-weight: 600; color: #e67e22; margin-bottom: 6px; }
.advice-desc { font-size: 12px; color: #888; margin-bottom: 10px; }
.advice-tips { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.advice-tip { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #555; }
.tip-dot { width: 4px; height: 4px; background: #ffa502; border-radius: 50%; }
.food-box { background: #fff; border-radius: 8px; padding: 10px; }
.food-lbl { font-size: 11px; color: #999; margin-bottom: 6px; display: block; }
.food-list { display: flex; flex-wrap: wrap; gap: 6px; }
.food-tag { background: linear-gradient(135deg, #ffeaa7, #fdcb6e); color: #8b4513; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }

/* ===== Health Page ===== */
.health-page { display: flex; flex-direction: column; height: calc(100vh - 110px); background: #f6f6f8; overflow: hidden; }
.health-header { flex-shrink: 0; padding: 10px 12px 12px; background: linear-gradient(180deg, #ff9ec0, #ffb6c1); }
.search-box { display: flex; align-items: center; height: 34px; background: #fff; border-radius: 17px; padding: 0 12px; box-shadow: 0 2px 6px rgba(212,96,127,0.15); }
.search-box input { flex: 1; height: 34px; font-size: 13px; }
.search-clear { width: 18px; height: 18px; background: #e3e3e3; color: #fff; border-radius: 50%; font-size: 11px; text-align: center; line-height: 18px; }
.banner-strip { flex-shrink: 0; height: 100px; margin: -4px 12px 0; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.banner-card { min-width: 220px; height: 85px; border-radius: 12px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; box-shadow: 0 5px 12px rgba(212,96,127,0.22); }
.banner-title { color: #fff; font-size: 18px; font-weight: 700; }
.banner-sub { color: rgba(255,255,255,0.92); font-size: 12px; margin-top: 6px; }
.banner-go { color: rgba(255,255,255,0.85); font-size: 32px; }

.cat-nav { flex-shrink: 0; display: flex; overflow-x: auto; padding: 10px 6px 4px; background: #f6f6f8; gap: 4px; }
.cat-item { display: flex; flex-direction: column; align-items: center; width: 66px; padding: 4px 0; flex-shrink: 0; }
.cat-icon { width: 44px; height: 44px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 3px 7px rgba(0,0,0,0.06); transition: transform 0.2s; }
.cat-item.active .cat-icon { transform: translateY(-2px) scale(1.05); box-shadow: 0 5px 10px rgba(255,107,157,0.3); }
.cat-name { font-size: 12px; color: #666; margin-top: 5px; }
.cat-item.active .cat-name { color: #d43f6e; font-weight: 600; }

.health-body { flex: 1; min-height: 0; display: flex; }
.side-nav { width: 84px; flex-shrink: 0; background: #fff; overflow-y: auto; }
.side-item { padding: 13px 6px; text-align: center; font-size: 13px; color: #666; border-left: 3px solid transparent; line-height: 1.3; }
.side-item.active { color: #d43f6e; font-weight: 700; background: #f6f6f8; border-left-color: #ff6b9d; }
.main-area { flex: 1; min-width: 0; overflow-y: auto; padding: 0 8px; }

.tabs { display: flex; background: #fff; border-radius: 9px; padding: 4px; margin: 4px 0 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); position: sticky; top: 0; z-index: 5; }
.tab { flex: 1; display: flex; align-items: center; justify-content: center; height: 32px; font-size: 13px; color: #888; border-radius: 7px; gap: 4px; }
.tab.active { background: linear-gradient(135deg, #ff8fb1, #ff5f8f); color: #fff; font-weight: 700; box-shadow: 0 3px 7px rgba(255,95,143,0.32); }
.tab-badge { font-size: 10px; padding: 0 5px; border-radius: 8px; background: #ffe3ee; color: #d43f6e; min-width: 15px; text-align: center; }
.tab.active .tab-badge { background: rgba(255,255,255,0.3); color: #fff; }

.product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding-bottom: 20px; }
.p-card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 7px rgba(0,0,0,0.05); cursor: pointer; }
.p-media { position: relative; width: 100%; padding-bottom: 100%; background: #faf7f8; overflow: hidden; }
.p-media img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
.p-ph { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.p-ph-char { font-size: 48px; color: rgba(255,255,255,0.92); font-weight: 700; }
.p-ph-brand { margin-top: 6px; font-size: 11px; color: rgba(255,255,255,0.95); background: rgba(0,0,0,0.12); padding: 2px 8px; border-radius: 8px; }
.p-name { padding: 6px 8px 2px; font-size: 13px; color: #2b2b2b; line-height: 1.35; min-height: 34px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 500; }
.p-tags { padding: 2px 8px 0; display: flex; flex-wrap: wrap; gap: 3px; }
.p-tag { font-size: 10px; color: #d43f6e; background: #fff0f5; padding: 1px 5px; border-radius: 3px; }
.p-foot { display: flex; align-items: flex-end; justify-content: space-between; padding: 4px 8px 0; }
.p-price { color: #ff3b5c; font-size: 17px; font-weight: 800; line-height: 1; }
.p-price .yen { font-size: 11px; margin-right: 1px; }
.p-rate { font-size: 11px; color: #ff9500; }
.p-sales { padding: 3px 8px 7px; font-size: 10px; color: #9a9a9a; }

.avoid-list { padding-bottom: 10px; }
.a-card { background: #fff; border-radius: 9px; padding: 11px 12px 8px; margin-bottom: 9px; border-left: 4px solid #ff4d5e; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; }
.a-card.s1 { border-left-color: #e8333f; } .a-card.s2 { border-left-color: #ff6b6b; } .a-card.s3 { border-left-color: #ff9500; }
.a-head { display: flex; align-items: center; }
.a-sev { font-size: 10px; color: #fff; border-radius: 4px; padding: 2px 7px; margin-right: 7px; }
.a-type { flex: 1; font-size: 11px; color: #9a9a9a; }
.a-arrow { color: #ccc; font-size: 20px; transition: transform 0.2s; }
.a-arrow.up { transform: rotate(90deg); }
.a-title { margin-top: 7px; font-size: 14px; font-weight: 700; color: #2b2b2b; }
.a-reason { margin-top: 5px; font-size: 12px; color: #7a5a5a; line-height: 1.5; }
.a-tip { margin-top: 7px; background: #fff8ec; border-radius: 6px; padding: 7px 9px; font-size: 12px; color: #b07418; line-height: 1.5; }
.a-source { margin-top: 6px; font-size: 10px; color: #a9a9a9; }
.a-foot-tip { margin-top: 5px; text-align: right; font-size: 10px; color: #c0c0c0; }

.empty-state { padding: 40px 0 30px; text-align: center; color: #9a9a9a; font-size: 14px; }
.empty-icon { font-size: 44px; margin-bottom: 10px; }
.empty-sub { margin-top: 5px; font-size: 11px; color: #bdbdbd; }

.search-tip { display: flex; justify-content: space-between; align-items: center; margin: 8px 12px 0; padding: 8px 12px; background: #fff; border-radius: 8px; font-size: 13px; color: #666; }
.search-exit { color: #d43f6e; font-size: 12px; }

/* ===== Diary Page ===== */
.diary-container { background: linear-gradient(180deg, #fff0f5 0%, #ffe8ee 30%, #fff5f8 100%); padding: 10px; min-height: calc(100vh - 110px); }
.diary-stats { display: flex; align-items: center; background: linear-gradient(135deg, #ff8fab, #d4607f); border-radius: 12px; padding: 14px 6px; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(212,96,127,0.25); }
.diary-stat { flex: 1; display: flex; flex-direction: column; align-items: center; }
.diary-stat-num { font-size: 22px; font-weight: 700; color: #fff; }
.diary-stat-lbl { font-size: 11px; color: rgba(255,255,255,0.9); margin-top: 4px; white-space: nowrap; }
.diary-stat-divider { width: 1px; height: 28px; background: rgba(255,255,255,0.35); }

.diary-cal { background: #fff; border-radius: 12px; padding: 12px 8px; box-shadow: 0 2px 10px rgba(255,150,180,0.12); margin-bottom: 10px; }
.diary-cal-head { display: flex; justify-content: space-between; align-items: center; padding: 0 5px 4px; }
.diary-cal-arrow { font-size: 22px; color: #d4607f; padding: 4px 8px; }
.diary-cal-month { font-size: 17px; font-weight: 600; color: #444; }
.diary-cal .days-grid { display: flex; flex-wrap: wrap; }
.diary-cal .days-grid .d { width: 14.28%; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 50%; position: relative; font-size: 13px; color: #444; cursor: pointer; }
.diary-cal .days-grid .d.dim { color: #ddd; }
.diary-cal .days-grid .d.today .dn { color: #e0485f; font-weight: 700; }
.diary-cal .days-grid .d.selected { background: #ffe8ee; }
.diary-cal .days-grid .d.selected .dn { color: #d4607f; font-weight: 600; }
.diary-cal .days-grid .dn { font-size: 13px; line-height: 1; }
.diary-cal .days-grid .de { font-size: 9px; position: absolute; bottom: 2px; }

.diary-edit { background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 2px 10px rgba(255,150,180,0.10); margin-bottom: 10px; }
.diary-edit-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.diary-edit-title { font-size: 14px; color: #888; }
.diary-edit-del { font-size: 16px; padding: 3px 6px; }

.mood-cats { display: flex; overflow-x: auto; gap: 6px; margin-bottom: 10px; padding-bottom: 2px; }
.mood-cat { padding: 6px 14px; border-radius: 20px; font-size: 13px; color: #888; background: #f7f7f7; white-space: nowrap; flex-shrink: 0; }
.mood-cat.active { color: #fff; }

.emoji-grid { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.emoji-cell { width: calc(25% - 4px); box-sizing: border-box; border: 1px solid #f0f0f0; border-radius: 7px; padding: 7px 4px; text-align: center; cursor: pointer; }
.emoji-cell.on { border-width: 2px; }
.ec-emoji { font-size: 20px; line-height: 1; display: block; }
.ec-label { font-size: 10px; color: #999; margin-top: 2px; display: block; }

.intensity-row { display: flex; align-items: center; gap: 6px; padding: 7px 8px; background: #fffafc; border-radius: 7px; border: 1px solid #ffe8ee; margin-bottom: 10px; }
.intensity-label { font-size: 12px; color: #999; flex-shrink: 0; }
.intensity-slider { flex: 1; height: 4px; -webkit-appearance: none; appearance: none; background: #ffe8ee; border-radius: 2px; }
.intensity-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #ff8fab; }
.intensity-val { font-size: 12px; color: #d4607f; font-weight: 700; min-width: 40px; text-align: right; flex-shrink: 0; }

.tag-group { margin-bottom: 10px; }
.tg-title { font-size: 12px; color: #888; margin-bottom: 5px; display: block; }
.tg-list { display: flex; flex-wrap: wrap; gap: 6px; }
.tg-tag { font-size: 12px; padding: 4px 10px; border-radius: 15px; background: #f7f7f7; color: #777; cursor: pointer; border: 1px solid transparent; }
.tg-tag.on-trigger { background: #ffe8ee; color: #d4607f; border-color: #ffb6c1; }
.tg-tag.on-body { background: #fff5d6; color: #c98800; border-color: #f5d77a; }

.diary-textarea { width: 100%; border: 1px solid #ffe8ee; border-radius: 7px; padding: 9px 10px; font-size: 14px; min-height: 70px; margin-bottom: 7px; background: #fffafc; resize: vertical; }

.diary-summary { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; padding: 7px 10px; background: linear-gradient(135deg, #fff5fa, #ffe8f0); border-radius: 7px; margin-bottom: 9px; border-left: 3px solid #ff8fab; }
.ss-emoji { font-size: 18px; }

<script>
// ===== storage.js - 账号隔离的本地存储 =====
const ISOLATED_KEYS = new Set([
  'cart', 'favorites', 'dailyPeriodRecords', 'diary', 'periodSettings',
  'feedbacks', 'fav_messages', 'ai_pending_question', 'ai_prefill_product_id',
  'healthDataSyncedV1'
]);

function _extractUserId() {
  try {
    const token = localStorage.getItem('token') || '';
    const p = JSON.parse(localStorage.getItem('userProfile') || 'null') || {};
    if (p.userId) return String(p.userId);
    if (token && token.indexOf('.') > 0) {
      try {
        const parts = token.split('.');
        if (parts[1]) {
          const pad = parts[1] + '==='.slice((3 - parts[1].length % 3) % 3);
          const payload = JSON.parse(decodeURIComponent(escape(atob(pad))));
          if (payload.userId || payload.sub) return String(payload.userId || payload.sub);
        }
      } catch (e) {}
    }
    if (token && token.indexOf('wx_local_') === 0) {
      let localId = localStorage.getItem('local_user_id');
      if (!localId) { localId = 'local_' + Date.now(); localStorage.setItem('local_user_id', localId); }
      return localId;
    }
  } catch (e) {}
  let mc = localStorage.getItem('machine_code');
  if (!mc) { mc = 'mc_' + (Date.now() % 100000000) + '_' + Math.random().toString(36).slice(2, 10); localStorage.setItem('machine_code', mc); }
  return 'anon_' + mc.slice(0, 8);
}

function scopedKey(baseKey) {
  if (!ISOLATED_KEYS.has(baseKey)) return baseKey;
  return 'u_' + _extractUserId() + ':' + baseKey;
}

const Storage = {
  get(key, fallback) {
    try {
      const val = localStorage.getItem(scopedKey(key));
      if (val === null) return fallback;
      try { return JSON.parse(val); } catch (e) { return val; }
    } catch (e) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(scopedKey(key), typeof value === 'string' ? value : JSON.stringify(value)); } catch (e) {}
  },
  remove(key) {
    try { localStorage.removeItem(scopedKey(key)); } catch (e) {}
  },
  getCurrentUserId() { return _extractUserId(); },
  clearCurrentUserIsolated() {
    const uid = _extractUserId();
    const prefix = 'u_' + uid + ':';
    Object.keys(localStorage).forEach(k => { if (k.indexOf(prefix) === 0) localStorage.removeItem(k); });
  },
  fullLogout() {
    this.clearCurrentUserIsolated();
    ['token','userProfile','local_user_id'].forEach(k => localStorage.removeItem(k));
  }
};

window.Storage = Storage;

</script>
<script>
// ===== api.js - 网络请求层 =====
const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
  ? 'http://localhost:3000/api'
  : '/api';

let _token = localStorage.getItem('token') || '';

const Api = {
  setToken(t) { _token = t; if(t) localStorage.setItem('token', t); else localStorage.removeItem('token'); },
  getToken() { return _token; },
  getHost() { return API_BASE; },
  async request(path, options = {}) {
    const url = API_BASE + path;
    const headers = { 'Content-Type': 'application/json' };
    if (_token) headers['Authorization'] = 'Bearer ' + _token;
    try {
      const res = await fetch(url, {
        method: options.method || 'GET',
        headers,
        body: options.data ? JSON.stringify(options.data) : undefined
      });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) { Api.setToken(''); localStorage.removeItem('userProfile'); }
      if (res.status >= 200 && res.status < 300) return data;
      throw { code: res.status, message: data.message || '请求失败' };
    } catch (err) {
      throw { code: -1, message: err.message || '网络错误' };
    }
  },
  // 用户
  login(data) { return this.request('/users/login', { method:'POST', data }); },
  devLogin(data) { return this.request('/users/dev-login', { method:'POST', data }); },
  logout() { return this.request('/users/logout', { method:'POST' }); },
  getProfile() { return this.request('/users/profile'); },
  // 经期
  getPeriodSettings() { return this.request('/period/settings'); },

  aiAgent(data) { return this.request('/ai/agent', { method:'POST', data }); },
  aiRecommend(data) { return this.request('/ai/recommend', { method:'POST', data }); },
  getHealthReport(days) { return this.request('/ai/health-report?days='+(days||30)); },
  ttsUrl(text) { return API_BASE + '/ai/tts?text=' + encodeURIComponent(text); },
  // 商品
  getProducts(params) {
    const qs = params ? Object.entries(params).map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&') : '';

    return this.request('/medical/records' + (qs ? '?'+qs : ''));
  },
  saveMedicalRecord(data) { return this.request('/medical/records', { method:'POST', data }); },
  deleteMedicalRecord(id) { return this.request('/medical/records/'+id, { method:'DELETE' }); },

<script>
// ===== utils.js - 工具函数 =====
const Utils = {
  pad2(n) { return n < 10 ? '0'+n : ''+n; },
  fmtDate(d) {
    if (typeof d === 'string') return d;
    return d.getFullYear()+'-'+this.pad2(d.getMonth()+1)+'-'+this.pad2(d.getDate());
  },
  fmtDateShort(s) {
    if (!s) return '';
    const parts = String(s).split('-');
    return Number(parts[1])+'月'+Number(parts[2])+'日';
  },
  toast(msg, duration=1800) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => { t.style.display = 'none'; }, duration);
  },
  modal(opts) {
    const box = document.getElementById('modal');
    document.getElementById('modalTitle').textContent = opts.title || '';
    document.getElementById('modalContent').innerHTML = opts.content || '';
    const cancel = document.getElementById('modalCancel');
    const confirm = document.getElementById('modalConfirm');
    if (opts.showCancel === false) cancel.style.display = 'none'; else cancel.style.display = '';
    cancel.onclick = () => { box.style.display='none'; opts.onCancel && opts.onCancel(); };
    confirm.textContent = opts.confirmText || '确定';
    confirm.onclick = () => { box.style.display='none'; opts.onConfirm && opts.onConfirm(); };
    box.style.display = 'flex';
  },
  showActionSheet(items) {
    // Simple confirm-style action sheet simulation
    return new Promise((resolve) => {
      const opts = items.map((t,i) => `${i+1}. ${t}`).join('\n');
      const choice = prompt(opts + '\n\n输入序号选择：');
      if (choice && !isNaN(choice)) {
        const idx = parseInt(choice) - 1;
        if (idx >= 0 && idx < items.length) resolve(idx); else resolve(-1);
      } else resolve(-1);
    });
  },
  copyText(text) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); this.toast('已复制'); }
    catch(e) { this.toast('复制失败'); }
    document.body.removeChild(ta);
  }
};

window.Utils = Utils;

</script>
<script>
// ===== router.js - Hash Router =====
const Router = {
  current: 'period',
  params: {},
  tabPages: ['period','health','diary','ai','me'],
  pages: {},

  init() {
    window.addEventListener('hashchange', () => this._handle());
    document.getElementById('navBack').onclick = () => this.back();
    // TabBar 点击
    document.querySelectorAll('.tab-item').forEach(btn => {
      btn.onclick = () => this.goTab(btn.dataset.tab);
    });
    this._handle();
  },

  register(name, handler) { this.pages[name] = handler; },

  goTab(name) {
    location.hash = '#/' + name;
  },

  go(name, params={}) {
    const qs = Object.entries(params).map(([k,v]) => k+'='+encodeURIComponent(v)).join('&');
    location.hash = '#/' + name + (qs ? '?'+qs : '');
  },

  back() {
    if (this.currentTabBarPage()) {
      location.hash = '#/' + this.current;
    } else {
      history.back();
    }
  },

  currentTabBarPage() { return this.tabPages.includes(this.current); },

  _handle() {
    const hash = location.hash.replace(/^#\/?/, '');
    const [path, query] = hash.split('?');
    const params = {};
    if (query) query.split('&').forEach(kv => { const [k,v] = kv.split('='); params[k] = decodeURIComponent(v||''); });

    const name = path || 'period';
    this.current = name;
    this.params = params;

    // TabBar UI
    document.querySelectorAll('.tab-item').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === name);
    });

    const isTabBar = this.tabPages.includes(name);
    document.getElementById('tabBar').style.display = isTabBar ? '' : 'none';
    document.getElementById('navBack').style.display = isTabBar ? 'none' : '';

    // Nav title
    const titles = {
      period:'经期记录', health:'健康防护', diary:'心情日记', ai:'AI助手', me:'个人中心',
      symptoms:'选择症状', settings:'设置', product:'商品详情', cart:'购物车', favorites:'我的收藏',
      care:'科学护理', records:'健康档案', report:'健康报告', feedback:'意见反馈',
      about:'关于我们', blockchain:'区块链存证'
    };
    document.getElementById('navTitle').textContent = titles[name] || name;

    const container = document.getElementById('pageContainer');
    container.innerHTML = '';
    const handler = this.pages[name];
    if (handler) handler(container, params);
    else container.innerHTML = '<div style="padding:40px;text-align:center;color:#999">页面加载中...<br><br><button class="btn" onclick="location.reload()">刷新</button></div>';

    window.scrollTo(0, 0);
  }
};

window.Router = Router;

</script>

  function normalizeDate(dateStr) {

  // ====== 算法模块 ======
  function findPeriodGroups(periodDates, periodLength) {
    if (periodDates.length === 0) return [];

  }
  function extractStartDates(groups) { return groups.map(g => g[0]); }
  function extendPeriodGroups(groups, periodDates, periodLength) {

    for (const group of groups) {
      const minDate = new Date(group[0]);
      const maxDate = new Date(group[group.length-1]);
      const actualLen = Math.round((maxDate - minDate)/86400000) + 1;
      const daysToExtend = periodLength - actualLen;
      if (daysToExtend > 0) maxDate.setDate(maxDate.getDate() + daysToExtend);
      extGroups.push({
        startDate: fmt(minDate), endDate: fmt(maxDate), originalDates: group
      });
      for (let d = new Date(minDate); d <= maxDate; d.setDate(d.getDate()+1)) {
        const ds = normalizeDate(fmt(d));
        if (!dateInList(ds, periodDates) && !dateInList(ds, extDates)) extDates.push(ds);

    return { groups: extGroups, extendedDates: extDates };
  }
  function calculateSmartValues(dailyRecords) {
    const periodDates = Object.keys(dailyRecords).filter(k => dailyRecords[k] && dailyRecords[k].status === 1).sort();
    if (periodDates.length < 5) return { avgPeriod: 7, avgCycle: 28, cycleCount: 0, hasEnoughData: false };
    const groups = findPeriodGroups(periodDates, 15);
    const startDates = extractStartDates(groups);
    if (startDates.length < 2) return { avgPeriod: 7, avgCycle: 28, cycleCount: 0, hasEnoughData: false };
    const avgPeriod = calculateAvgPeriodLength(groups);
    const avgCycle = calculateAvgCycleLength(startDates);
    return { avgPeriod, avgCycle, cycleCount: startDates.length, hasEnoughData: true };
  }
  function calculateWeights(cycleCount) {
    const table = { 1:[1.0,0], 2:[0.8,0.2], 3:[0.6,0.4], 4:[0.4,0.6], 5:[0.25,0.75] };
    if (table[cycleCount]) return { userWeight: table[cycleCount][0], smartWeight: table[cycleCount][1] };
    if (cycleCount >= 6) return { userWeight: 0.1, smartWeight: 0.9 };
    return { userWeight: 1.0, smartWeight: 0.0 };
  }
  function calculateAvgPeriodLength(groups) {
    const lengths = [];
    for (const g of groups) {
      if (g.length > 0) {
        const min = new Date(g[0]); const max = new Date(g[g.length-1]);
        const d = Math.round((max - min)/86400000) + 1;
        if (d >= 3 && d <= 15) lengths.push(d);
      }
    }
    if (lengths.length === 0) return 7;
    return Math.round(lengths.reduce((a,b)=>a+b,0)/lengths.length);
  }
  function calculateAvgCycleLength(startDates) {
    const cycles = [];
    for (let i = 1; i < startDates.length; i++) {
      const diff = Math.round((new Date(startDates[i]) - new Date(startDates[i-1]))/86400000);
      if (diff >= 21 && diff <= 45) cycles.push(diff);
    }
    if (cycles.length === 0) return 28;

  }
  function removeOutliers(data) {
    if (data.length < 3) return data;

  function calculatePredictionConfidence(cycleCount, regularityScore) {
    if (cycleCount <= 1) return { confidence: 30, level: '低', color: '#e74c3c' };

    if (cycleCount === 3) return { confidence: 60, level: '中等', color: '#f1c40f' };

  }
  function calculateRegularityScore(startDates) {

  function getHealthWarnings(periodDates, startDates, dailyRecords) {

      }
      if (n > 0 && totalFlow/n >= 4) warnings.push({ type:'warning', title:'经血量较多', message:'检测到您的经血量较多，建议注意补充铁质，如有不适请及时就医。' });
    }

      for (let i = 1; i < startDates.length; i++) cycles.push(Math.round((new Date(startDates[i]) - new Date(startDates[i-1]))/86400000));
      if (calculateVariance(cycles) > 50) warnings.push({ type:'info', title:'周期波动提示', message:'您的周期波动较大，建议保持规律作息，减轻压力。' });
    }

      if (diff > 45) { warnings.push({ type:'warning', title:'检测到过长周期', message:'周期长于45天，建议咨询医生。' }); break; }

  }
  function calculateVariance(data) {
    if (data.length === 0) return 0;
    const mean = data.reduce((a,b)=>a+b,0)/data.length;
    return data.reduce((s,v)=>s+Math.pow(v-mean,2),0)/data.length;
  }
  function analyzeCycles(startDates, periodDates, defaultCycle, defaultPeriod, useAlgorithm) {
    let avgCycle = defaultCycle, avgPeriod = defaultPeriod;
    let regularity = '暂无数据', isIrregular = false, advice = '';

    if (startDates.length >= 2 && useAlgorithm) {
      const cycles = [];

        const diff = Math.round((new Date(startDates[i]) - new Date(startDates[i-1]))/86400000);

      }
      if (cycles.length > 0) {
        let weightedSum = 0, weightSum = 0;
        for (let i = 0; i < cycles.length; i++) { const w = i+1; weightedSum += cycles[i]*w; weightSum += w; }
        avgCycle = Math.round(weightedSum / weightSum);
        if (cycles.length >= 2) {
          const m = cycles.reduce((a,b)=>a+b,0)/cycles.length;
          const stdDev = Math.sqrt(calculateVariance(cycles));
          if (stdDev <= 2) regularity = '非常规律 🎉';
          else if (stdDev <= 4) regularity = '比较规律 ✨';
          else if (stdDev <= 8) regularity = '基本规律 💫';
          else { regularity = '周期不规律 ⚠️'; isIrregular = true; advice = getIrregularAdvice(stdDev, cycles); }
        } else { regularity = '逐渐规律中...'; }

    } else if (startDates.length === 1) {

  function calculateActualPeriodLength(startDates, periodDates, defaultPeriod) {
    if (startDates.length < 2) return defaultPeriod;
    const lengths = [];
    for (const sd of startDates) {
      const start = new Date(sd); let len = 0;
      for (let j = 0; j < 30; j++) {
        const check = new Date(start); check.setDate(start.getDate()+j);
        const ds = fmt(check);

  // ====== 主预测入口 ======
  function computePredictions(records) {
    const dailyRecords = records || state.dailyRecords;
    const settings = Storage.get('periodSettings') || {};
    let cycleLength = settings.cycleLength || 28;
    let periodLength = settings.periodLength || 7;
    const useAlgorithm = settings.useAlgorithm !== false;

    if (useAlgorithm) {
      const sv = calculateSmartValues(dailyRecords);
      if (sv.hasEnoughData) {
        const w = calculateWeights(sv.cycleCount);
        cycleLength = Math.round(cycleLength * w.userWeight + sv.avgCycle * w.smartWeight);
        periodLength = Math.round(periodLength * w.userWeight + sv.avgPeriod * w.smartWeight);
      }
    }

    const periodDates = Object.keys(dailyRecords).filter(k => dailyRecords[k] && dailyRecords[k].status === 1).sort();

    if (periodDates.length === 0) {

        extendedDates:[],
        nextPeriodDate:'', nextOvulationPeriod:'', nextOvulationDay:'',
        daysToNextPeriod:0,
        currentPhase:'未知', currentPhaseDesc:'请先记录至少一次经期~', phaseForAI:'未知',
        futurePredictions:[],

        cycleRegularity:'暂无数据',
        showHealthAdvice:false,

    const lastEnd = new Date(lastGroup.endDate);

    const today = new Date(); const todayStr = fmt(today);

    // predicted periods: extended + future 3 cycles

      const cycleStart = new Date(lastStart);
      cycleStart.setDate(lastStart.getDate() + avgCycle * c);
