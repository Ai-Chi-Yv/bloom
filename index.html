          <button style="position:absolute;right:10px;font-size:18px;padding:4px 8px" data-action="settings">⚙️</button>
        </div>
        <div style="text-align:center;font-size:10px;color:#ccc;margin-bottom:6px">← 左右滑动切换月份 →</div>
        ${banner}
        ${irregular}
        <div class="calendar">
          <div class="weekdays">${state.weekdays.map(w => '<span>'+w+'</span>').join('')}</div>
          <div class="days">${daysHTML}</div>
          <div class="legend">
            <div class="legend-item"><div class="lg p"></div>记录·经期</div>
            <div class="legend-item"><div class="lg pp"></div>预测·经期</div>
            <div class="legend-item"><div class="lg o"></div>排卵期</div>
            <div class="legend-item"><div class="lg od"></div>排卵日</div>
          </div>
        </div>

        <div class="section-title">经期记录（${state.selectedDate || '请选择日期'}）</div>
        <div class="record-section">
          <div class="record-item">
            <span class="record-label">月经</span>
            <div class="record-value" style="display:flex;gap:6px">
              <button class="flow-btn ${state.periodStatus===0?'active':''}" data-val="0">没来</button>
              <button class="flow-btn ${state.periodStatus===1?'active':''}" data-val="1">来了</button>
            </div>
          </div>
          ${state.periodStatus===1 ? `
          <div class="record-item"><span class="record-label">流量</span>
            <div class="record-row">${[1,2,3].map(i => `<button class="flow-btn ${state.flowLevel>=i?'active':''}" data-flow="${i}">${'🩸'.repeat(i)}</button>`).join('')}</div></div>
          <div class="record-item"><span class="record-label">痛感</span>
            <div class="record-row">${[1,2,3].map(i => `<button class="pain-btn ${state.painLevel>=i?'active':''}" data-pain="${i}">${'⚡'.repeat(i)}</button>`).join('')}</div></div>` : ''}
          <div class="record-item" style="cursor:pointer" data-action="symptoms">
            <span class="record-label">症状</span>
            <div class="symptoms-list">${state.selectedSymptoms.length===0 ? '<span style="color:#999">点击选择</span>' : state.selectedSymptoms.map(s=>'<span class="tag tag-pink">'+s+'</span>').join('')}</div>
          </div>
        </div>

        <div class="prediction">
          <div class="prediction-title">智能经期预测
            <span class="pred-confidence" style="background:${conf.color}">可信度 ${conf.confidence}% · ${conf.level}</span>
          </div>
          <div class="prediction-stats">
            <div class="stat-col"><div class="stat-num">${state.daysToNextPeriod}</div><div class="stat-lbl">天后来潮</div></div>
            <div class="stat-col"><div class="stat-num">${state.avgCycleLength}</div><div class="stat-lbl">天平均周期</div></div>
            <div class="stat-col"><div class="stat-num">${state.cycleRegularity}</div><div class="stat-lbl">周期状态</div></div>
          </div>
          ${state.nextPeriodDate ? `
          <div class="prediction-detail">
            <div class="pred-row"><span class="pred-lbl">预计经期</span><span class="pred-val period">${state.nextPeriodDate}</span></div>
            ${state.nextOvulationPeriod ? `<div class="pred-row"><span class="pred-lbl">预计排卵期</span><span class="pred-val ovulation">${state.nextOvulationPeriod}</span></div>` : ''}
            ${state.nextOvulationDay ? `<div class="pred-row"><span class="pred-lbl">预计排卵日</span><span class="pred-val ovday">${state.nextOvulationDay}</span></div>` : ''}
          </div>` : ''}
          ${state.futurePredictions.length>0 ? `
          <div class="trend">
            <span class="trend-lbl">未来3次预测来潮</span>
            <div class="trend-items">${state.futurePredictions.map((p,i)=>`<span>第${i+1}次：${p}</span>`).join('')}</div>
          </div>` : ''}
        </div>

        ${warningsHTML ? `<div class="hw-block"><div class="hw-block-title">🩺 健康关注</div>${warningsHTML}</div>` : ''}

        ${state.showHealthAdvice && state.healthAdvice.title ? `
        <div class="health-advice">
          <div class="advice-title">${state.healthAdvice.title}</div>
          <div class="advice-desc">${state.healthAdvice.desc}</div>
          <div class="advice-tips">${state.healthAdvice.tips.map(t=>'<div class="advice-tip"><div class="tip-dot"></div>'+t+'</div>').join('')}</div>
          <div class="food-box"><span class="food-lbl">🍽️ 推荐食材</span><div class="food-list">${state.healthAdvice.food.map(f=>'<span class="food-tag">'+f+'</span>').join('')}</div></div>
        </div>` : ''}
      </div>
    `;

    container.querySelectorAll('.period-arrow').forEach(btn => {
      btn.onclick = () => {
        if (btn.dataset.action === 'prev') { state.month--; if (state.month < 1) { state.month = 12; state.year--; } }
        else { state.month++; if (state.month > 12) { state.month = 1; state.year++; } }
        state.selectedDate = ''; state.periodStatus = 0; state.flowLevel = 0; state.painLevel = 0; state.selectedSymptoms = [];
        render();
      };
    });
    container.querySelector('[data-action="settings"]').onclick = () => Router.go('settings');
    container.querySelectorAll('.day').forEach(d => {
      d.onclick = () => {
        const date = d.dataset.date; state.selectedDate = date;
        const rec = state.dailyRecords[date];
        if (rec) { state.periodStatus = rec.status||0; state.flowLevel = rec.flow||0; state.painLevel = rec.pain||0; state.selectedSymptoms = rec.symptoms||[]; }
        else { state.periodStatus = 0; state.flowLevel = 0; state.painLevel = 0; state.selectedSymptoms = []; }
        render();
      };
    });
    container.querySelectorAll('.flow-btn[data-val]').forEach(b => b.onclick = () => { state.periodStatus = parseInt(b.dataset.val); if (state.selectedDate) saveRecord(); render(); });
    container.querySelectorAll('.flow-btn[data-flow]').forEach(b => b.onclick = () => { state.flowLevel = parseInt(b.dataset.flow); if (state.selectedDate) saveRecord(); render(); });
    container.querySelectorAll('.pain-btn').forEach(b => b.onclick = () => { state.painLevel = parseInt(b.dataset.pain); if (state.selectedDate) saveRecord(); render(); });
    container.querySelector('[data-action="symptoms"]').onclick = () => { Router.go('symptoms', { date: state.selectedDate || '' }); };

    let sx, sy;
    container.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; });
    container.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 60) {
        if (dx > 0) { state.month--; if (state.month < 1) { state.month = 12; state.year--; } }
        else { state.month++; if (state.month > 12) { state.month = 1; state.year++; } }
        render();
      }
    });
  }

  function renderDay(d, isCurrentMonth) {
    const dateStr = fmt(d);
    const rec = state.dailyRecords[dateStr];
    const isToday = dateStr === fmt(new Date());
    const isSelected = state.selectedDate === dateStr;
    const isPeriod = rec && rec.status === 1;
    const isPredicted = !rec && dateInList(dateStr, state.predictedPeriods);
    const isOvulation = dateInList(dateStr, state.predictedOvulations);
    const isOvDay = dateInList(dateStr, state.predictedOvulationDays);

    let dots = '';
    if (isPeriod) dots += '<div class="dot period"></div>';
    else if (isPredicted) dots += '<div class="dot predict"></div>';
    if (isOvulation) dots += '<div class="dot ovulation"></div>';
    if (isOvDay) dots += '<div class="dot ovday"></div>';

    return `<div class="day ${isCurrentMonth?'':'other'} ${isToday?'today':''} ${isSelected?'selected':''}" data-date="${dateStr}">
      <span class="dn">${d.getDate()}</span>${dots}
    </div>`;
  }

  function saveRecord() {
    const date = state.selectedDate; if (!date) return;
    const records = Storage.get('dailyPeriodRecords') || {};
    const prevDate = new Date(date); prevDate.setDate(prevDate.getDate() - 1);
    const prevStr = fmt(prevDate);
    records[date] = {
      status: state.periodStatus, flow: state.flowLevel, pain: state.painLevel,
      symptoms: state.selectedSymptoms.slice(),
      isFirst: state.periodStatus === 1 && (!records[prevStr] || records[prevStr].status !== 1)
    };
    Storage.set('dailyPeriodRecords', records);
    try { Api.savePeriodRecord({ date, periodStatus: state.periodStatus, flowLevel: state.flowLevel, painLevel: state.painLevel, symptoms: state.selectedSymptoms }); } catch(e){}
  }

  // init
  const saved = Storage.get('dailyPeriodRecords') || {};
  state.selectedDate = fmt(new Date());
  const todayRec = saved[state.selectedDate];
  if (todayRec) { state.periodStatus = todayRec.status||0; state.flowLevel = todayRec.flow||0; state.painLevel = todayRec.pain||0; state.selectedSymptoms = todayRec.symptoms||[]; }

  // 从症状选择页回传（sessionStorage bridge）：返回时把所选症状应用到对应日期
  try {
    const pending = sessionStorage.getItem('pending_period_symptoms');
    if (pending) {
      sessionStorage.removeItem('pending_period_symptoms');
      const p = JSON.parse(pending) || {};
      if (p.date) state.selectedDate = p.date;
      const rec = saved[state.selectedDate] || { status:0, flow:0, pain:0, symptoms:[] };
      rec.symptoms = (p.symptoms || []).slice();
      rec.status = rec.status || 0;
      saved[state.selectedDate] = rec;
      Storage.set('dailyPeriodRecords', saved);
      state.selectedSymptoms = rec.symptoms.slice();
      state.periodStatus = rec.status; state.flowLevel = rec.flow; state.painLevel = rec.pain;
      try { Api.savePeriodRecord({ date: state.selectedDate, symptoms: rec.symptoms }); } catch(e){}
    }
  } catch(e){}

  render();
});

</script>
<script>
// ===== Health Page - 健康防护/电商 =====
Router.register('health', function(root, params) {
  if (params.tab === 'avoid') {
    setTimeout(() => render({ currentTab:'avoid' }), 0);
  }
  const state = {
    horizontalNav: 0,
    verticalNav: 0,
    currentTab: 'products',
    keyword: '',
    searching: false
  };

  function hashStr(s) { let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
  function brandChar(brand) { const m=String(brand||'').match(/[\u4e00-\u9fa5]/); if(m) return m[0]; return String(brand||'品').charAt(0).toUpperCase(); }
  const GRADIENTS = [['#ff9a9e','#fad0c4'],['#a18cd1','#fbc2eb'],['#a6c1ee','#c2e9fb'],['#84fab0','#8fd3f4'],['#fccb90','#d57eeb']];

  function applyView() {
    const cat = Catalog.CATEGORIES[state.horizontalNav];
    const sub = cat && cat.subs[state.verticalNav];
    const kw = (state.keyword || '').trim().toLowerCase();
    let products = Catalog.PRODUCTS.slice();
    let avoids = Catalog.AVOID_PRODUCTS.slice();

    if (kw) {
      products = products.filter(p => (p.brand+p.name+(p.features||[]).join('')+p.category+p.subCategory).toLowerCase().includes(kw));
      avoids = avoids.filter(a => (a.brand+a.name+a.reason+a.issueType+a.category).toLowerCase().includes(kw));
    } else if (cat && sub) {
      products = products.filter(p => p.category === cat.key && p.subCategory === sub.key);
      avoids = avoids.filter(a => a.category === cat.key);
    }

    products.sort((a,b)=> (b.rating-a.rating) || (b.sales-a.sales));
    avoids.sort((a,b)=> a.severity-b.severity);

    return { cat, sub, products, avoids };
  }

  function render() {
    const { cat, products, avoids } = applyView();
    const hNavs = Catalog.CATEGORIES;
    const subNavs = cat ? cat.subs : [];

    let productsHTML = '';
    if (state.currentTab === 'products') {
      productsHTML = products.length === 0 ? `<div class="empty-state"><div class="empty-icon">🫧</div><div>暂无相关精选商品</div><div class="empty-sub">换个关键词或分类看看吧</div></div>` :
        `<div class="product-grid">${products.map(p => {
          const g = GRADIENTS[hashStr(p.brand) % GRADIENTS.length];
          const ph = p.image ? `<img src="${p.image}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'p-ph\\' style=\\'background:linear-gradient(135deg,${g[0]},${g[1]})\\'><div class=\\'p-ph-char\\'>${brandChar(p.brand)}</div><div class=\\'p-ph-brand\\'>${p.brand}</div></div>'">` :
            `<div class="p-ph" style="background:linear-gradient(135deg,${g[0]},${g[1]})"><div class="p-ph-char">${brandChar(p.brand)}</div><div class="p-ph-brand">${p.brand}</div></div>`;
          return `<div class="p-card" data-action="goto-detail" data-id="${p.id}">
            <div class="p-media">${ph}</div>
            <div class="p-name">${p.name}</div>
            <div class="p-tags">${(p.features||[]).slice(0,2).map(f=>'<span class="p-tag">'+f+'</span>').join('')}</div>
            <div class="p-foot"><div class="p-price"><span class="yen">¥</span>${p.price.toFixed(1)}</div><div class="p-rate">★${p.rating}</div></div>
            <div class="p-sales">${Catalog.formatSales(p.sales)}人付款</div>
          </div>`;
        }).join('')}</div>`;
    } else {
      productsHTML = avoids.length === 0 ? `<div class="empty-state"><div class="empty-icon">🛡️</div><div>该分类暂无避雷记录</div><div class="empty-sub">精选库持续更新中</div></div>` :
        `<div class="avoid-list">${avoids.map(a => `<div class="a-card s${a.severity}" data-toggle="${a.id}">
          <div class="a-head">
            <span class="a-sev sev-bg-${a.severity}">${a.severityText}</span>
            <span class="a-type">${a.issueType}</span>
            <span class="a-arrow" id="arrow-${a.id}">›</span>
          </div>
          <div class="a-title">${a.brand} · ${a.name}</div>
          <div class="a-reason">${a.reasonShort}</div>
          <div id="extra-${a.id}" style="display:none">
            ${a.tip ? `<div class="a-tip">💡 ${a.tip}</div>` : ''}
            <div class="a-source">📎 来源：${a.evidence}</div>
          </div>
          <div class="a-foot-tip">点击展开详情与消费提示</div>
        </div>`).join('')}</div>`;
    }

    root.innerHTML = `
      <div class="health-page">
        <div class="health-header">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input placeholder="搜索卫生巾/益生菌/血压计…" value="${state.keyword}" id="searchInput"/>
            <span class="search-clear" id="searchClear" style="display:${state.keyword?'':'none'}">✕</span>
          </div>
        </div>

        ${!state.searching ? `
        <div class="banner-strip">
          ${Catalog.BANNERS.map((b,i)=>`<div class="banner-card" style="background:${b.gradient}" data-banner="${i}">
            <div><div class="banner-title">${b.title}</div><div class="banner-sub">${b.sub}</div></div>
            <div class="banner-go">›</div>
          </div>`).join('')}
        </div>
        <div class="cat-nav">
          ${hNavs.map((c,i)=>`<div class="cat-item ${state.horizontalNav===i?'active':''}" data-hnav="${i}"><div class="cat-icon">${c.icon}</div><div class="cat-name">${c.name}</div></div>`).join('')}
        </div>` : `<div class="search-tip"><span>“${state.keyword}” 的搜索结果</span><span class="search-exit" id="searchExit">返回分类 ✕</span></div>`}

        <div class="health-body">
          ${!state.searching ? `<div class="side-nav">${subNavs.map((s,i)=>`<div class="side-item ${state.verticalNav===i?'active':''}" data-vnav="${i}">${s.icon} ${s.name}</div>`).join('')}</div>` : ''}
          <div class="main-area">
            <div class="tabs">
              <div class="tab ${state.currentTab==='products'?'active':''}" data-tab="products"><span>精选推荐</span><span class="tab-badge">${products.length}</span></div>
              <div class="tab ${state.currentTab==='avoid'?'active':''}" data-tab="avoid"><span>消费避雷</span><span class="tab-badge tab-badge-warn">${avoids.length}</span></div>
            </div>
            ${productsHTML}
          </div>
        </div>
      </div>`;

    // events
    const inp = document.getElementById('searchInput');
    if (inp) {
      inp.oninput = e => { state.keyword = e.target.value; document.getElementById('searchClear').style.display = state.keyword?'':'none'; };
      inp.onkeydown = e => { if (e.key === 'Enter') { state.searching = !!state.keyword.trim(); render(); } };
    }
    const clearBtn = document.getElementById('searchClear');
    if (clearBtn) clearBtn.onclick = () => { state.keyword=''; state.searching=false; render(); };
    const exitBtn = document.getElementById('searchExit');
    if (exitBtn) exitBtn.onclick = () => { state.keyword=''; state.searching=false; render(); };

    root.querySelectorAll('[data-hnav]').forEach(b => b.onclick = () => { state.horizontalNav = parseInt(b.dataset.hnav); state.verticalNav = 0; render(); });
    root.querySelectorAll('[data-vnav]').forEach(b => b.onclick = () => { state.verticalNav = parseInt(b.dataset.vnav); render(); });
    root.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { state.currentTab = b.dataset.tab; render(); });
    root.querySelectorAll('[data-action="goto-detail"]').forEach(c => c.onclick = () => Router.go('product', { id: c.dataset.id }));
    root.querySelectorAll('.p-card').forEach(c => c.onclick = () => Router.go('product', { id: c.dataset.id }));

    // banner clicks
    root.querySelectorAll('[data-banner]').forEach(b => b.onclick = () => {
      const i = parseInt(b.dataset.banner);
      if (i === 2) Router.goTab('ai'); else if (i === 1) { state.currentTab='avoid'; render(); }
    });

    // avoid expand
    root.querySelectorAll('[data-toggle]').forEach(c => c.onclick = () => {
      const id = c.dataset.toggle; const extra = document.getElementById('extra-'+id); const arrow = document.getElementById('arrow-'+id);
      if (extra) extra.style.display = extra.style.display === 'none' ? 'block' : 'none';
      if (arrow) arrow.classList.toggle('a-arrow-up');
    });
  }

  render();
});

</script>
<script>
// ===== Diary Page - 心情日记 =====
Router.register('diary', function(root, params) {
  const MOOD_CATEGORIES = [
    { key:'happy', label:'愉悦', color:'#ffb6c1', items:[{emoji:'😊',label:'开心'},{emoji:'🥳',label:'兴奋'},{emoji:'😍',label:'满足'},{emoji:'😌',label:'平静'},{emoji:'🥰',label:'感恩'},{emoji:'🤩',label:'惊喜'},{emoji:'😂',label:'大笑'},{emoji:'😇',label:'幸福'}]},
    { key:'sad', label:'低落', color:'#7ea9e1', items:[{emoji:'😢',label:'难过'},{emoji:'😭',label:'委屈'},{emoji:'😔',label:'失落'},{emoji:'🥺',label:'受伤'},{emoji:'😞',label:'沮丧'},{emoji:'😣',label:'无助'},{emoji:'🥲',label:'心酸'},{emoji:'😿',label:'孤单'}]},
    { key:'angry', label:'愤怒', color:'#e8927c', items:[{emoji:'😡',label:'生气'},{emoji:'😤',label:'烦躁'},{emoji:'🤬',label:'愤怒'},{emoji:'💢',label:'不满'},{emoji:'🙄',label:'无语'},{emoji:'😒',label:'吐槽'}]},
    { key:'anxious', label:'焦虑', color:'#c9a0dc', items:[{emoji:'😰',label:'焦虑'},{emoji:'😨',label:'紧张'},{emoji:'😟',label:'担心'},{emoji:'🤔',label:'迷茫'},{emoji:'😵‍💫',label:'混乱'},{emoji:'😰',label:'压力'}]},
    { key:'tired', label:'疲惫', color:'#b8b8b8', items:[{emoji:'😴',label:'困倦'},{emoji:'😮‍💨',label:'累'},{emoji:'🥱',label:'无聊'},{emoji:'😶‍🌫️',label:'麻木'},{emoji:'🙃',label:'应付'},{emoji:'😵',label:'精疲力尽'}]},
    { key:'neutral', label:'中性', color:'#a8d5ba', items:[{emoji:'🙂',label:'一般'},{emoji:'😐',label:'平静'},{emoji:'🤗',label:'温暖'},{emoji:'🤓',label:'专注'},{emoji:'🧐',label:'思考'},{emoji:'😷',label:'低调'}]},
  ];
  const TRIGGER_TAGS = ['工作','学习','家庭','朋友','感情','金钱','健康','经期','天气','独处','美食','运动','睡眠','突发事件','其他'];
  const BODY_TAGS = ['无痛经','轻微痛经','严重痛经','腰酸','头痛','乳房胀痛','下腹坠胀','疲劳','失眠','食欲变化','长痘','水肿','情绪波动','手脚冰凉'];
  const INTENSITY_LABELS = ['很淡','有点','一般','挺强','非常'];
  const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  const state = {
    year: new Date().getFullYear(),
    month: new Date().getMonth(),
    selectedDate: Utils.fmtDate(new Date()),
    activeCategory: 'happy',
    selectedEmoji: '',
    selectedMoodLabel: '',
    intensity: 3,
    selectedTriggers: [],
    selectedBodies: [],
    content: '',
    reloadSelected: true
  };

  function calcStats(diary) {
    const keys = Object.keys(diary).sort();
    const total = keys.length;
    const pad = n => String(n).padStart(2, '0');
    const prefix = state.year+'-'+pad(state.month+1)+'-';
    const monthCount = keys.filter(k => k.indexOf(prefix) === 0).length;
    let streak = 0;
    const cursor = new Date();
    if (!diary[Utils.fmtDate(cursor)]) cursor.setDate(cursor.getDate()-1);
    while (diary[Utils.fmtDate(cursor)]) { streak++; cursor.setDate(cursor.getDate()-1); }
    const moodDist = {};
    keys.filter(k => k.indexOf(prefix) === 0).forEach(k => {
      const d = diary[k]; const m = (d && d.mood) || '未分类';
      moodDist[m] = (moodDist[m] || 0) + 1;
    });
    return { streak, monthCount, total, moodDist };
  }

  function render() {
    const diary = Storage.get('diary') || {};
    const stats = calcStats(diary);

    // 仅当需要加载选中日期数据时（点了某天/首次打开），才把编辑区刷新为该天内容
    const currentDiary = diary[state.selectedDate];
    if (state.reloadSelected) {
      if (currentDiary) {
        state.selectedEmoji = currentDiary.emoji || '';
        state.selectedMoodLabel = currentDiary.mood || '';
        state.activeCategory = currentDiary.moodCategory || 'happy';
        state.intensity = currentDiary.intensity || 3;
        state.selectedTriggers = currentDiary.triggers || [];
        state.selectedBodies = currentDiary.body || [];
        state.content = currentDiary.content || '';
      } else {
        state.selectedEmoji = ''; state.selectedMoodLabel = ''; state.activeCategory = 'happy';
        state.intensity = 3; state.selectedTriggers = []; state.selectedBodies = []; state.content = '';
      }
      state.reloadSelected = false;
    }

    // days
    const days = [];
    const firstDay = new Date(state.year, state.month, 1);
    const lastDay = new Date(state.year, state.month+1, 0);
    const startDay = firstDay.getDay();
    for (let i = startDay - 1; i >= 0; i--) {
      const d = new Date(state.year, state.month, -i);
      days.push({ day: d.getDate(), date: Utils.fmtDate(d), isCurrent: false });
    }
    for (let i = 1; i <= lastDay.getDate(); i++) {
      const d = new Date(state.year, state.month, i);
      days.push({ day: i, date: Utils.fmtDate(d), isCurrent: true, isToday: Utils.fmtDate(d) === Utils.fmtDate(new Date()) });
    }
    let nextDays = 42 - days.length;
    for (let i = 1; i <= nextDays; i++) {
      const d = new Date(state.year, state.month+1, i);
      days.push({ day: i, date: Utils.fmtDate(d), isCurrent: false });
    }

    const activeCat = MOOD_CATEGORIES.find(c => c.key === state.activeCategory);

    root.innerHTML = `
      <div class="diary-container">
        <div class="diary-stats">
          <div class="diary-stat"><div class="diary-stat-num">${stats.streak}</div><div class="diary-stat-lbl">🔥 连续打卡</div></div>
          <div class="diary-stat-divider"></div>
          <div class="diary-stat"><div class="diary-stat-num">${stats.monthCount}</div><div class="diary-stat-lbl">📅 本月篇数</div></div>
          <div class="diary-stat-divider"></div>
          <div class="diary-stat"><div class="diary-stat-num">${stats.total}</div><div class="diary-stat-lbl">✨ 累计篇数</div></div>
        </div>

        <div class="diary-cal">
          <div class="diary-cal-head">
            <button class="diary-cal-arrow" data-action="prev">‹</button>
            <div class="diary-cal-month">${state.year}年 ${state.month+1}月</div>
            <button class="diary-cal-arrow" data-action="next">›</button>
          </div>
          <div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
          <div class="days-grid">
            ${days.map(d => `<div class="d ${!d.isCurrent?'dim':''} ${d.isToday?'today':''} ${d.date===state.selectedDate?'selected':''}" data-date="${d.date}"><span class="dn">${d.day}</span>${diary[d.date]?`<span class="de">${diary[d.date].emoji}</span>`:''}</div>`).join('')}
          </div>
        </div>

        <div class="diary-edit">
          <div class="diary-edit-head">
            <div class="diary-edit-title">✍️ ${state.selectedDate || '先选个日子'} 的心情</div>
            ${currentDiary ? '<button class="diary-edit-del" data-action="delete">🗑️</button>' : ''}
          </div>
          <div class="mood-cats">
            ${MOOD_CATEGORIES.map(c => `<div class="mood-cat ${state.activeCategory===c.key?'active':''}" data-cat="${c.key}" ${state.activeCategory===c.key?'style="background:'+c.color+'"':''}>${c.label}</div>`).join('')}
          </div>
          <div class="emoji-grid">
            ${activeCat ? activeCat.items.map(it => `<div class="emoji-cell ${state.selectedEmoji===it.emoji?'on':''}" data-emoji="${it.emoji}" data-label="${it.label}" ${state.selectedEmoji===it.emoji?'style="border-color:'+activeCat.color+';background:'+activeCat.color+'20"':''}>
              <span class="ec-emoji">${it.emoji}</span><span class="ec-label">${it.label}</span>
            </div>`).join('') : ''}
          </div>
          <div class="intensity-row">
            <span class="intensity-label">情绪强度</span>
            <input type="range" min="1" max="5" value="${state.intensity}" class="intensity-slider" id="intensitySlider"/>
            <span class="intensity-val">${INTENSITY_LABELS[state.intensity-1]}</span>
          </div>
          <div class="tag-group">
            <span class="tg-title">🔖 今天因为什么</span>
            <div class="tg-list">${TRIGGER_TAGS.map(t => `<span class="tg-tag ${state.selectedTriggers.includes(t)?'on-trigger':''}" data-trigger="${t}">${t}</span>`).join('')}</div>
          </div>
          <div class="tag-group">
            <span class="tg-title">💗 身体感受</span>
            <div class="tg-list">${BODY_TAGS.map(t => `<span class="tg-tag ${state.selectedBodies.includes(t)?'on-body':''}" data-body="${t}">${t}</span>`).join('')}</div>
          </div>
          <textarea class="diary-textarea" placeholder="今天发生了什么？有什么想记下来的..." id="diaryContent">${esc(state.content)}</textarea>
          ${state.selectedEmoji || state.selectedTriggers.length || state.selectedBodies.length ? `
          <div class="diary-summary">
            <span class="ss-emoji">${state.selectedEmoji}</span>
            <span class="ss-text">${state.selectedMoodLabel || '选个心情吧'}</span>
            ${state.selectedTriggers.length ? `<span class="ss-more">· ${state.selectedTriggers.join('/')}</span>` : ''}
            ${state.selectedBodies.length ? `<span class="ss-more">· ${state.selectedBodies.join('/')}</span>` : ''}
          </div>` : ''}
          <button class="save-diary-btn" data-action="save">💾 保存日记</button>
        </div>

        ${currentDiary ? `
        <div class="diary-show">
          <div class="diary-show-head">
            <div class="diary-show-emoji">${currentDiary.emoji}</div>
            <div class="diary-show-meta">
              <div class="diary-show-mood">${currentDiary.mood || '未命名心情'}</div>
              <div class="diary-show-intensity">强度 ${currentDiary.intensity || 3}/5</div>
            </div>
          </div>
          ${currentDiary.triggers && currentDiary.triggers.length ? `<div style="font-size:12px;color:#888;margin-bottom:4px">触发：${currentDiary.triggers.map(t=>'<span class="tag tag-pink">#'+t+'</span>').join(' ')}</div>` : ''}
          ${currentDiary.body && currentDiary.body.length ? `<div style="font-size:12px;color:#888;margin-bottom:6px">身体：${currentDiary.body.map(t=>'<span class="tag" style="background:#fff5d6;color:#c98800">'+t+'</span>').join(' ')}</div>` : ''}
          <div class="diary-show-content">${esc(currentDiary.content || '（无内容）')}</div>
          ${currentDiary.updatedAt ? `<span class="diary-show-time">更新于 ${new Date(currentDiary.updatedAt).toLocaleString()}</span>` : ''}
        </div>` : ''}

        ${stats.monthCount > 0 ? `
        <div class="dist-card">
          <span class="dist-title">📊 本月情绪分布</span>
          <div class="dist-tags">${Object.entries(stats.moodDist).map(([n,c])=>`<div class="dist-item"><span>${n}</span><span class="di-count">${c}</span></div>`).join('')}</div>
        </div>` : ''}

        <div class="ai-card" data-action="goai">
          <span class="ai-icon">💗</span>
          <div class="ai-info">
            <span class="ai-title">AI心情疗愈</span>
            <span class="ai-sub">${state.selectedEmoji ? '基于你今天的心情 '+state.selectedMoodLabel+'，小暖为你准备了专属建议' : '记录心情后获取 AI 专属疗愈建议'}</span>
          </div>
          <span class="ai-arrow">›</span>
        </div>
      </div>
    `;

    // events
    root.querySelectorAll('.diary-cal-arrow').forEach(b => b.onclick = () => {
      if (b.dataset.action === 'prev') { state.month--; if (state.month<0){state.month=11;state.year--;} }
      else { state.month++; if (state.month>11){state.month=0;state.year++;} }
      render();
    });
    root.querySelectorAll('.d').forEach(d => d.onclick = () => { state.selectedDate = d.dataset.date; state.reloadSelected = true; render(); });
    root.querySelectorAll('.mood-cat').forEach(b => b.onclick = () => { state.activeCategory = b.dataset.cat; render(); });
    root.querySelectorAll('.emoji-cell').forEach(c => c.onclick = () => { state.selectedEmoji = c.dataset.emoji; state.selectedMoodLabel = c.dataset.label; render(); });
    root.querySelectorAll('.tg-tag[data-trigger]').forEach(t => t.onclick = () => {
      const v = t.dataset.trigger; const idx = state.selectedTriggers.indexOf(v);
      if (idx >= 0) state.selectedTriggers.splice(idx, 1); else state.selectedTriggers.push(v);
      render();
    });
    root.querySelectorAll('.tg-tag[data-body]').forEach(t => t.onclick = () => {
      const v = t.dataset.body; const idx = state.selectedBodies.indexOf(v);
      if (idx >= 0) state.selectedBodies.splice(idx, 1); else state.selectedBodies.push(v);
      render();
    });
    const slider = document.getElementById('intensitySlider');
    if (slider) slider.oninput = e => { state.intensity = parseInt(e.target.value); document.querySelector('.intensity-val').textContent = INTENSITY_LABELS[state.intensity-1]; };
    const ta = document.getElementById('diaryContent');
    if (ta) ta.oninput = e => { state.content = e.target.value; };
    root.querySelector('[data-action="save"]').onclick = () => {
      if (!state.selectedDate) return Utils.toast('请先选择日期');
      if (!state.selectedEmoji) return Utils.toast('选一个心情吧');
      const diary = Storage.get('diary') || {};
      const entry = {
        emoji: state.selectedEmoji, mood: state.selectedMoodLabel, moodCategory: state.activeCategory,
        intensity: state.intensity, triggers: state.selectedTriggers, body: state.selectedBodies,
        content: state.content, createdAt: Date.now(), updatedAt: Date.now()
      };
      diary[state.selectedDate] = entry;
      Storage.set('diary', diary);
      Utils.toast('保存成功 ✨');
      render();
    };
    root.querySelector('[data-action="delete"]').onclick = () => {
      Utils.modal({
        title: '删除这篇日记？', content: '删除后无法恢复哦',
        confirmText: '删除', onConfirm: () => {
          const diary = Storage.get('diary') || {}; delete diary[state.selectedDate];
          Storage.set('diary', diary);
          state.selectedEmoji = ''; state.selectedMoodLabel = ''; state.selectedTriggers = []; state.selectedBodies = []; state.content = '';
          render(); Utils.toast('已删除');
        }
      });
    };
    root.querySelector('[data-action="goai"]').onclick = () => Router.goTab('ai');
  }

  render();
});

</script>
<script>
// ===== AI Chat Page - 升级版 =====
Router.register('ai', function(root, params) {
  const state = {
    tabIndex: 0,
    messages: [],
    agentMessages: [],
    inputText: '', agentInputText: '',
    isChatLoading: false, isAgentLoading: false,
    speakingId: null,
    blockchainRecords: [], lastChainTime: '--',
    blockDetail: null, showBlockDetail: false, showVerifyModal: false, verifyResult: null,
    quickQuestions: ['经期延迟怎么办？','如何缓解痛经？','经期可以运动吗？','如何调理月经周期？','推荐什么卫生巾？'],
    quickEmojis: ['😊','🥰','😢','😡','😰','😴','👍','💪','🙏','❤️','✨','🎉'],
    agentTools: [
      { name:'记录经期', icon:'📝', question:'我今天来月经了，帮我记录一下' },
      { name:'写心情日记', icon:'💭', question:'今天好开心，天气也不错，帮我写进日记' },
      { name:'加购卫生巾', icon:'🛒', question:'给我加3款平价优秀卫生巾到购物车' },
      { name:'避坑清理', icon:'⚠️', question:'帮我查一下需要避雷的产品' },
      { name:'经期设置', icon:'⚙️', question:'帮我把月经周期改成30天，经期5天' },
      { name:'清空购物车', icon:'🗑️', question:'帮我清空购物车' },
    ],
    refreshing: false
  };

  function fmtTime() { return new Date().getHours().toString().padStart(2,'0') + ':' + new Date().getMinutes().toString().padStart(2,'0'); }

  function loadRecommendLocal() {
    const daily = Storage.get('dailyPeriodRecords') || {};
    const diary = Storage.get('diary') || {};
    const settings = Storage.get('periodSettings') || {};
    const cLen = settings.cycleLength || 28;
    const pLen = settings.periodLength || 7;
    const pdDates = Object.keys(daily).filter(k => daily[k] && daily[k].status === 1).sort();

    let phase = '未知', daysToNext = 0;
    if (pdDates.length > 0) {
      const last = new Date(pdDates[pdDates.length - 1]);
      const next = new Date(last); next.setDate(last.getDate() + cLen);
      daysToNext = Math.max(0, Math.ceil((next - new Date())/86400000));
      const since = Math.ceil((new Date() - last)/86400000);
      if (since <= pLen) phase = '经期';
      else if (since <= pLen + 5) phase = '卵泡期';
      else if (daysToNext <= 14 && daysToNext > 8) phase = '排卵期';
      else if (daysToNext <= 8 && daysToNext > 0) phase = '黄体期';
      else phase = '卵泡期';
    }

    const todayStr = Utils.fmtDate(new Date());
    const todayRec = daily[todayStr];
    const dd = diary[todayStr];
    const symptoms = todayRec ? todayRec.symptoms || [] : [];
    const hasData = phase !== '未知' || dd || symptoms.length > 0;

    if (!hasData) {
      return { phase:'提示', recommendation:'👋 您好！为了给您提供更精准的健康建议，请先记录您的经期信息或心情日记哦~\n\n📅 在经期记录页面标记经期日期\n💭 记录每天的心情状态', products:[], medicalAdvice:[] };
    }

    const adviceMap = {
      '经期': '🌸 经期小贴士：\n• 注意保暖，避免受凉\n• 饮食清淡，多喝温水\n• 保证充足睡眠\n• 适当休息，避免剧烈运动',
      '卵泡期': '🌱 卵泡期小贴士：\n• 身体正在恢复，适合补充营养\n• 可以开始规律运动\n• 保持积极乐观的心态',
      '排卵期': '✨ 排卵期小贴士：\n• 雌激素水平较高，皮肤状态好\n• 精力充沛，适合重要工作\n• 注意个人卫生',
      '黄体期': '🌙 黄体期小贴士：\n• 孕激素升高，注意情绪调节\n• 减少咖啡因摄入\n• 适当补充镁元素（坚果、香蕉）'
    };
    const medAdvice = [];
    if (todayRec && todayRec.pain >= 2) medAdvice.push('检测到你有中度以上痛感，建议热敷+止痛药缓解，持续痛经需就医');
    if (todayRec && todayRec.flow >= 3) medAdvice.push('今日经血量较多，注意补充铁质（红枣、菠菜）');
    if (phase === '黄体期') medAdvice.push('黄体期情绪易波动，注意减压放松');

    let rec = adviceMap[phase] + '\n';
    if (symptoms.length) rec += `• 您记录的症状：${symptoms.join('、')}\n`;
    if (dd) rec += `\n💭 今日心情：${dd.emoji || ''} ${dd.mood || ''}\n`;
    rec += '\n📌 今日建议：保持规律作息、多喝水、适当运动30分钟、保持心情愉悦';

    let products = [];
    if (Catalog && Catalog.PRODUCTS) {
      if (phase === '经期') products = Catalog.PRODUCTS.filter(p => p.subCategory === '卫生巾').slice(0, 3);
      else if (phase === '排卵期') products = Catalog.PRODUCTS.filter(p => p.subCategory === '卫生湿巾').slice(0, 2);
      else products = Catalog.PRODUCTS.slice(0, 3);
    }
    products = products.map(p => { Catalog.decorateProduct && Catalog.decorateProduct(p); return p; });

    return { phase, recommendation: rec, products, medicalAdvice: medAdvice };
  }

  function loadBC() {
    const records = Storage.get('blockchainRecords') || [];
    state.blockchainRecords = records.slice(0, 50).map(r => ({
      ...r,
      hashShort: (r.block_hash || '').slice(0, 20),
      timeText: r.created_at ? new Date(r.created_at).toLocaleString() : ''
    }));
    state.lastChainTime = state.blockchainRecords[0]?.timeText || '--';
  }

  function render() {
    const container = root;
    const tabNames = ['智能推荐','AI问答','AI Agent','区块链'];

    container.innerHTML = `
      <div class="ai-page">
        <div class="ai-tabs">
          ${tabNames.map((t,i) => `<div class="ai-tab ${state.tabIndex===i?'active':''}" data-tab="${i}">${t}</div>`).join('')}
        </div>
        <div class="chat-body">
          ${state.tabIndex===0 ? renderRecommend() : ''}
          ${state.tabIndex===1 ? renderChat() : ''}
          ${state.tabIndex===2 ? renderAgent() : ''}
          ${state.tabIndex===3 ? renderBlockchain() : ''}
        </div>
        ${state.showBlockDetail || state.showVerifyModal ? renderModal() : ''}
      </div>
    `;

    container.querySelectorAll('.ai-tab').forEach(b => b.onclick = () => { state.tabIndex = parseInt(b.dataset.tab); render(); });

    if (state.tabIndex === 0) {
      const rb = container.querySelector('[data-go-report]');
      if (rb) rb.onclick = () => Router.go('report');
      container.querySelectorAll('.quick-item').forEach(b => b.onclick = () => { state.inputText = b.textContent; state.tabIndex = 1; render(); });
      container.querySelectorAll('[data-refresh-rec]').forEach(b => {
        let loading = false;
        b.onclick = () => { if (loading) return; loading = true; state.refreshing = true; b.textContent = '刷新中...'; setTimeout(()=>{ loading=false; state.refreshing=false; b.textContent='🔄 刷新'; render(); }, 800); };
      });
      container.querySelectorAll('.rec-product-card').forEach(c => c.onclick = () => Router.go('product', { id: c.dataset.id }));
    }
    if (state.tabIndex === 1) {
      const sendBtn = container.querySelector('[data-chat-send]');
      const input = container.querySelector('#chatInput');
      if (input) input.oninput = e => { state.inputText = e.target.value; sendBtn.style.background = state.inputText ? 'linear-gradient(135deg,#ff8fb1,#ff5f8f)' : '#ddd'; };
      if (input) input.onkeydown = e => { if (e.key === 'Enter') sendChat(); };
      if (sendBtn) sendBtn.onclick = sendChat;
      container.querySelectorAll('[data-emoji]').forEach(b => b.onclick = () => { state.inputText += b.dataset.emoji; input.value = state.inputText; });
      container.querySelector('[data-chat-clear]').onclick = () => { state.messages = []; render(); };
      container.querySelectorAll('[data-speak]').forEach(b => b.onclick = () => {
        const idx = parseInt(b.dataset.index);
        if (state.speakingId === idx) { state.speakingId = null; } else { state.speakingId = idx; Utils.toast('🔊 模拟语音播报中（H5本地模式）'); setTimeout(()=>{ state.speakingId=null; render(); }, 3000); }
        render();
      });
      container.querySelectorAll('[data-copy-msg]').forEach(b => b.onclick = () => Utils.copyText(b.dataset.content));
      container.querySelectorAll('[data-fav-msg]').forEach(b => b.onclick = () => { const favs = Storage.get('fav_messages') || []; favs.push({ content: b.dataset.content, time: new Date().toISOString() }); Storage.set('fav_messages', favs); Utils.toast('⭐ 已收藏'); });
      container.querySelectorAll('[data-del-msg]').forEach(b => b.onclick = () => { state.messages.splice(parseInt(b.dataset.index),1); render(); });
    }
    if (state.tabIndex === 2) {
      const agentInput = container.querySelector('#agentInput');
      const agentSend = container.querySelector('[data-agent-send]');
      if (agentInput) agentInput.oninput = e => { state.agentInputText = e.target.value; };
      if (agentInput) agentInput.onkeydown = e => { if (e.key === 'Enter') sendAgent(); };
      if (agentSend) agentSend.onclick = sendAgent;
      container.querySelector('[data-agent-stop]').onclick = () => { state.isAgentLoading = false; render(); Utils.toast('已停止'); };
      container.querySelectorAll('[data-agent-tool]').forEach(b => b.onclick = () => { state.agentInputText = b.dataset.question; agentInput.value = state.agentInputText; });
      container.querySelectorAll('[data-agent-action]').forEach(b => {
        b.onclick = () => {
          const map = { goHealth:'health', goCare:'care', goPeriod:'period', goMood:'diary', goRecords:'records', goCart:'cart', goFavorites:'favorites', goProduct:'product' };
          if (map[b.dataset.action]) Router.go(map[b.dataset.action]);
        };
      });
    }
    if (state.tabIndex === 3) {
      container.querySelector('[data-bc-record]').onclick = recordOnChain;
      container.querySelector('[data-bc-verify]').onclick = verifyChain;
      container.querySelectorAll('.bc-item').forEach(c => c.onclick = () => {
        const idx = parseInt(c.dataset.idx);
        state.blockDetail = state.blockchainRecords[idx];
        state.showBlockDetail = true; render();
      });
      container.querySelectorAll('[data-copy-hash]').forEach(b => b.onclick = (e) => { e.stopPropagation(); Utils.copyText(b.dataset.hash); });
    }
    if (state.showBlockDetail || state.showVerifyModal) {
      container.querySelector('[data-modal-close]').onclick = () => { state.showBlockDetail = false; state.showVerifyModal = false; state.blockDetail = null; state.verifyResult = null; render(); };
      container.querySelector('[data-modal-mask]').onclick = () => { state.showBlockDetail = false; state.showVerifyModal = false; state.blockDetail = null; state.verifyResult = null; render(); };
    }
  }

  function renderRecommend() {
    const data = loadRecommendLocal();
    const productsHTML = data.products && data.products.length > 0 ?
      `<div class="rec-products">
        <div class="rp-title"><span>🛍️ 为你智能挑选</span></div>
        <div class="rp-scroll">
          ${data.products.map(p => `<div class="rp-card rec-product-card" data-id="${p.id}">
            <div class="pd-ph" style="background:linear-gradient(135deg,${p.placeholder?.from||'#ffb6c1'},${p.placeholder?.to||'#ff8fab'})"><span class="p-ph-char">${p.placeholder?.char||'🌸'}</span></div>
            <div class="rp-name">${p.name}</div>
            <div class="rp-brand" style="font-size:10px;color:#999">${p.brand||''}</div>
            <div class="rp-meta"><span class="rp-price" style="color:#ff5f8f">¥${p.price}</span></div>
          </div>`).join('')}
        </div>
      </div>` : '';

    return `
      <div style="flex:1;overflow-y:auto;padding:8px">
        <div class="report-entry" data-go-report>
          <div class="re-left"><span class="re-icon">🩺</span>
            <div><span class="re-title">AI 健康洞察报告</span><span class="re-desc">经期×情绪×症状生成专属身心分析</span></div>
          </div><span class="re-arrow">›</span>
        </div>
        <div class="recommend-card">
          <div class="rec-hdr"><span class="rec-icon">💡</span><span class="rec-title">今日智能推荐</span><span class="rec-phase">${data.phase}</span><span data-refresh-rec style="margin-left:auto;font-size:12px;color:#ff5f8f;cursor:pointer">🔄 刷新</span></div>
          <div class="rec-content">${data.recommendation.replace(/\n/g,'<br>')}</div>
          ${data.medicalAdvice && data.medicalAdvice.length > 0 ? `
          <div class="med-advice">
            <div class="ma-title">🩺 医疗建议与风险提醒</div>
            ${data.medicalAdvice.map(t => `<div class="ma-item"><span class="ma-dot">•</span><span>${t}</span></div>`).join('')}
          </div>` : ''}
          ${productsHTML}
          <div class="rec-disclaimer">以上建议仅供参考，如有不适请及时就医</div>
        </div>
        <div class="quick-section">
          <div class="quick-title">快捷提问</div>
          <div class="quick-list">${state.quickQuestions.map(q=>`<div class="quick-item">${q}</div>`).join('')}</div>
        </div>
      </div>
    `;
  }

  function renderChat() {
    return `
      <div class="chat-body">
        <div class="chat-toolbar"><span class="ct-title">💬 AI 智能问答</span><span class="ct-clear" data-chat-clear>🗑️ 清空</span></div>
        <div class="chat-scroll" id="chatScroll" style="flex:1;overflow-y:auto;padding:8px">
          ${state.messages.length === 0 ? `<div style="text-align:center;padding:40px 20px;color:#999">🤖 你好，我是小暖AI助手~<br><br>请问我能帮你什么？</div>` :
            state.messages.map((m,i) => `<div class="msg-row ${m.role==='user'?'right':'left'}">
              <div class="msg-bubble ${m.role==='user'?'right':'left'}">
                ${m.content.replace(/\n/g,'<br>')}
                ${m.role==='assistant' ? `<div class="speak-btn ${state.speakingId===i?'speaking':''}" data-speak data-index="${i}">${state.speakingId===i?'🔊 播报中':'🔈 语音播报'}</div>
                <div class="msg-action-row">
                  <span class="msg-act" data-copy-msg data-content="${m.content}">📋 复制</span>
                  <span class="msg-act" data-fav-msg data-content="${m.content}">⭐ 收藏</span>
                  <span class="msg-act" data-del-msg data-index="${i}">🗑️ 删除</span>
                </div>` : ''}
                <div class="msg-ts">${m.time}</div>
              </div>
            </div>`).join('')}
          ${state.isChatLoading ? `<div class="typing-row"><div class="typing-d"></div><div class="typing-d"></div><div class="typing-d"></div></div>` : ''}
        </div>
        <div class="input-area">
          ${state.inputText.length === 0 ? `<div class="emoji-bar">${state.quickEmojis.map(e => `<span class="emoji-chip" data-emoji="${e}">${e}</span>`).join('')}</div>` : ''}
          <div class="input-row">
            <div class="inp-box"><input class="inp-input" id="chatInput" value="${state.inputText}" placeholder="向小暖提问..."/></div>
            <div class="inp-send" data-chat-send>发送</div>
          </div>
        </div>
      </div>
    `;
  }

  function renderAgent() {
    return `
      <div class="chat-body">
        <div class="chat-toolbar"><span class="ct-title">🤖 AI Agent · 智能执行</span><span style="font-size:11px;color:#999">我能帮你做事，不只是回答</span></div>
        <div class="chat-scroll" style="flex:1;overflow-y:auto;padding:8px">
          ${state.agentMessages.length === 0 ? `<div style="text-align:center;padding:30px 10px;color:#999;font-size:13px">🤖 你好！我是小暖 AI Agent——<br><br>说「我今天来月经了」<br>说「帮我加3款卫生巾到购物车」<br>说「把周期改成30天经期5天」</div>` :
            state.agentMessages.map(m => renderAgentMsg(m)).join('')}
          ${state.isAgentLoading ? `<div class="typing-row"><div class="typing-d"></div><div class="typing-d"></div><div class="typing-d"></div></div>` : ''}
        </div>
        <div class="agent-tool-strip">${state.agentTools.map(t => `<div class="agent-chip ${state.isAgentLoading?'chip-disabled':''}" data-agent-tool data-question="${t.question}"><span class="agent-chip-icon">${t.icon}</span><span class="agent-chip-name">${t.name}</span></div>`).join('')}</div>
        <div class="input-area">
          <div class="input-row">
            <div class="inp-box"><input class="inp-input" id="agentInput" value="${state.agentInputText}" placeholder="向 Agent 下指令..." ${state.isAgentLoading?'disabled':''}/></div>
            ${state.isAgentLoading ? `<div class="inp-stop" data-agent-stop>停止</div>` : `<div class="inp-send" data-agent-send>发送</div>`}
          </div>
        </div>
      </div>
    `;
  }

  function renderAgentMsg(m) {
    if (m.type === 'trace') {
      return `<div class="msg-row left"><div class="msg-bubble left">
        <div class="trace-card">
          <div class="trace-head"><span class="trace-gear">⚙️</span><span class="trace-title">${m.traceTitle}</span></div>
          ${m.pending ? `<div class="trace-pending"><div class="trace-loader"><div class="trace-loader-bar"></div></div><span class="trace-hint">${m.hint}</span></div>` : ''}
          ${!m.pending && m.planStepCount ? `<div class="trace-cog-row">
            <span class="trace-cog cog-plan">🧠 规划${m.planStepCount}步</span>
            ${m.reflectCount>0 ? `<span class="trace-cog cog-reflect">🔄 反思${m.reflectCount}次</span>` : ''}
            ${m.memoryCount>0 ? `<span class="trace-cog cog-mem">📝 记忆${m.memoryCount}条</span>` : ''}
            <span class="trace-cog cog-time">⏱ ${m.executionLabel}</span>
          </div>` : ''}
          ${m.steps ? m.steps.map(s => `<div class="trace-step"><span class="trace-state">${s.ok?'✅':'❌'}</span><div class="step-texts"><span class="step-label">${s.label}</span><div class="step-summary">${s.summary||''}</div></div></div>`).join('') : ''}
          ${m.reflectBarText ? `<div class="trace-reflect-bar">${m.reflectBarText}</div>` : ''}
          ${m.actionButtons && m.actionButtons.length ? `<div class="agent-actions">${m.actionButtons.map(a=>`<button class="agent-act-btn" data-agent-action="${a.action}">${a.label}</button>`).join('')}</div>` : ''}
        </div>
        ${m.time ? `<div class="msg-ts">${m.time}</div>` : ''}
      </div></div>`;
    }
    return `<div class="msg-row ${m.role==='user'?'right':'left'}"><div class="msg-bubble ${m.role==='user'?'right':'left'}">
      ${m.content.replace(/\n/g,'<br>')}
      ${m.actionButtons && m.actionButtons.length ? `<div class="agent-actions">${m.actionButtons.map(a=>`<button class="agent-act-btn" data-agent-action="${a.action}">${a.label}</button>`).join('')}</div>` : ''}
      ${m.time ? `<div class="msg-ts">${m.time}</div>` : ''}
    </div></div>`;
  }

  function renderBlockchain() {
    loadBC();
    return `
      <div style="flex:1;overflow-y:auto;padding:8px">
        <div class="bc-overview">
          <div class="bc-ov-head"><span class="bc-ov-title">🔗 个人数据上链存证</span><span class="bc-ov-dot"></span><span class="bc-ov-status">实时</span></div>
          <div class="bc-ov-stats">
            <div class="bc-ov-cell"><span class="bc-ov-num">${state.blockchainRecords.length}</span><span class="bc-ov-lbl">存证记录</span></div>
            <div class="bc-ov-divider"></div>
            <div class="bc-ov-cell"><span class="bc-ov-num" style="font-size:12px">${state.lastChainTime}</span><span class="bc-ov-lbl">最近上链</span></div>
          </div>
        </div>
        <div class="bc-actions">
          <button class="bc-btn bc-1" data-bc-record>📝 数据上链</button>
          <button class="bc-btn bc-2" data-bc-verify>🔍 验证链</button>
        </div>
        ${state.blockchainRecords.length === 0 ? `<div class="bc-empty">暂无存证记录，点「📝 数据上链」开始</div>` :
          state.blockchainRecords.map((r,i) => `<div class="bc-item" data-idx="${i}">
            <div class="bc-top"><span class="bc-idx">#${r.block_index}</span><span class="bc-type">${r.record_type}</span><span class="bc-copy" data-copy-hash data-hash="${r.block_hash}">📋 复制 Hash</span></div>
            <div class="bc-hash"><span class="bc-lbl" style="color:#bbb;font-size:10px">哈希</span> <span style="word-break:break-all">${r.hashShort}...</span></div>
            <div class="bc-sum">${r.data_summary || ''}</div>
            <div class="bc-time">${r.timeText}</div>
          </div>`).join('')}
      </div>
    `;
  }

  function renderModal() {
    let body = '';
    if (state.showBlockDetail && state.blockDetail) {
      const b = state.blockDetail;
      body = `<div class="modal-row"><span class="modal-lbl">区块号</span><span>#${b.block_index}</span></div>
        <div class="modal-row"><span class="modal-lbl">类型</span><span>${b.record_type}</span></div>
        <div class="modal-row"><span class="modal-lbl">摘要</span><span>${b.data_summary||'-'}</span></div>
        <div class="modal-row"><span class="modal-lbl">哈希</span><span class="mono" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${b.block_hash}</span></div>
        <div class="modal-row"><span class="modal-lbl">前哈希</span><span class="mono">${b.previous_hash||'-'}</span></div>
        <div class="modal-row"><span class="modal-lbl">时间</span><span>${new Date(b.created_at).toLocaleString()}</span></div>
        <div class="modal-row"><span class="modal-lbl">状态</span><span style="color:#07c160">✅ 已验证</span></div>`;
    }
    return `<div class="modal-mask" data-modal-mask><div class="modal-box">
      <div class="modal-hdr">区块详情</div>
      ${body}
      <button class="modal-close" data-modal-close>关闭</button>
    </div></div>`;
  }

  function sendChat() {
    const text = state.inputText.trim();
    if (!text || state.isChatLoading) return;
    state.messages.push({ role:'user', content:text, time: fmtTime() });
    state.inputText = ''; state.isChatLoading = true; render();
    setTimeout(() => {
      state.messages.push({ role:'assistant', content: generateLocalReply(text), time: fmtTime() });
      state.isChatLoading = false; render();
    }, 900);
  }

  function generateLocalReply(text) {
    const lower = text.toLowerCase();
    if (lower.indexOf('痛经') >= 0 || lower.indexOf('痛') >= 0) return '痛经缓解建议：\n• 用热水袋或暖宝宝热敷腹部\n• 适当饮用红糖姜茶\n• 避免生冷食物和剧烈运动\n• 保证充足睡眠\n• 如果疼痛严重，可考虑短期服用止痛药\n\n如痛经持续加重或影响生活，建议及时就医检查。';
    if (lower.indexOf('提前') >= 0 || lower.indexOf('延迟') >= 0 || lower.indexOf('推迟') >= 0) return '经期提前/延迟的常见原因：\n• 压力过大或情绪波动\n• 生活作息不规律\n• 饮食变化或体重变化\n• 剧烈运动\n• 环境变化\n\n偶尔一次波动不必担心。如果连续3个周期不规律，建议就医检查。';
    if (lower.indexOf('运动') >= 0) return '经期运动建议：\n✅ 可以：散步、轻柔瑜伽、拉伸\n❌ 避免：跑步、游泳、力量训练、剧烈运动\n\n适量运动有助于缓解经期不适，但要注意不要过度。';
    if (lower.indexOf('卫生巾') >= 0 || lower.indexOf('护垫') >= 0) return '卫生巾选购建议：\n1. 优先选择医护级/消毒级认证产品\n2. 敏感肌选纯棉表层\n3. 避免含香精、药物成分的\n4. 勤更换（2-3小时一次）\n\n去「健康防护」页面查看精选推荐~';
    if (lower.indexOf('怀孕') >= 0 || lower.indexOf('备孕') >= 0) return '备孕建议：\n• 孕前3个月开始补充叶酸\n• 保持规律作息和健康饮食\n• 戒烟戒酒\n• 进行孕前检查\n• 监测排卵日（下次月经前14天）';
    if (lower.indexOf('情绪') >= 0 || lower.indexOf('心情') >= 0) return '情绪低落时可以试试：\n• 与信任的人聊一聊\n• 做自己喜欢的事转移注意力\n• 保持规律作息\n• 适当运动有助于改善情绪\n• 严重时建议寻求专业心理咨询';
    if (lower.indexOf('你好') >= 0 || lower.indexOf('在吗') >= 0) return '你好呀 💗 我是小暖，你的健康助手。有什么可以帮你的？';
    return '我理解你的问题了。建议你：\n\n1. 保持规律作息\n2. 均衡饮食\n3. 适当运动\n4. 关注身体信号\n\n具体问题也可以告诉我更多细节~';
  }

  function sendAgent() {
    const text = state.agentInputText.trim();
    if (!text || state.isAgentLoading) return;
    state.agentMessages.push({ role:'user', content:text });
    state.agentInputText = ''; state.isAgentLoading = true;

    // trace pending
    const traceId = Date.now();
    state.agentMessages.push({ id: traceId, role:'assistant', type:'trace', traceTitle:'正在规划执行步骤...', pending:true, hint:'AI 正在分析任务...' });
    render();

    setTimeout(() => {
      // resolve trace
      const last = state.agentMessages[state.agentMessages.length - 1];
      if (last && last.id === traceId && last.pending) {
        let steps = [], reply = '', actionButtons = [], reflectBar = '', planStepCount = 3, reflectCount = 0, memoryCount = 0;

        if (text.indexOf('来月经') >= 0 || text.indexOf('记录经期') >= 0) {
          const records = Storage.get('dailyPeriodRecords') || {};
          records[Utils.fmtDate(new Date())] = { status:1, flow:0, pain:0, symptoms:[] };
          Storage.set('dailyPeriodRecords', records);
          steps = [{ label:'解析意图：记录经期', summary:'识别为经期记录请求', ok:true }, { label:'验证今日日期', summary:Utils.fmtDate(new Date()), ok:true }, { label:'写入本地存储', summary:'Storage set dailyPeriodRecords ✓', ok:true }];
          planStepCount = 3; memoryCount = 1; reflectBar = '✅ 记录成功，建议补充流量/痛感';
          actionButtons = [{ label:'📅 去经期记录', action:'goPeriod' }];
          reply = '✅ 已为你记录今天来月经了！建议你去「经期记录」页面补充流量、痛感和症状详情~';
        } else if (text.indexOf('日记') >= 0 || text.indexOf('心情') >= 0) {
          steps = [{ label:'识别心情日记请求', ok:true }, { label:'准备跳转', summary:'打开日记 Tab', ok:true }];
          reflectBar = '去「心情日记」页面选个 emoji 吧 💗';
          actionButtons = [{ label:'💭 去心情日记', action:'goMood' }];
          reply = '📝 好的，去「心情日记」页面记录吧！';
        } else if (text.indexOf('加') >= 0 || text.indexOf('购物车') >= 0) {
          const cart = Storage.get('cart') || [];
          const targetProds = Catalog.PRODUCTS.filter(p => p.subCategory === '卫生巾').slice(0, 3);
          targetProds.forEach(p => {
            if (!cart.find(c => c.id === p.id)) cart.push({ id:p.id, name:p.name, brand:p.brand, price:String(p.price), quantity:1, checked:true, addedTime:Date.now() });
          });
          Storage.set('cart', cart);
          steps = [{ label:'查询商品目录', summary:'找到3款卫生巾', ok:true }, { label:'写入购物车', summary:`当前购物车 ${cart.length} 件`, ok:true }, { label:'生成办事按钮', ok:true }];
          planStepCount = 3; reflectCount = 1; memoryCount = 1;
          reflectBar = '🛒 加购完成！';
          actionButtons = [{ label:'🛒 去购物车看看', action:'goCart' }];
          reply = `🛒 已帮你加了 ${targetProds.length} 款卫生巾到购物车！`;
        } else if (text.indexOf('避雷') >= 0) {
          steps = [{ label:'查询避雷清单', summary:'5+ 款避雷产品', ok:true }];
          actionButtons = [{ label:'⚠️ 查看避雷清单', action:'goHealth' }];
          reflectBar = '去「健康防护」→ 消费避雷 Tab';
          reply = '⚠️ 为你查询需要避雷的产品清单，去「健康防护」→ 消费避雷 Tab 查看完整列表！';
        } else if (text.indexOf('周期') >= 0 || text.indexOf('设置') >= 0) {
          const numMatch = text.match(/(\d+)\s*天/);
          if (numMatch) {
            const num = parseInt(numMatch[1]);
            const settings = Storage.get('periodSettings') || {};
            if (text.indexOf('经期') >= 0 || text.indexOf('天数') >= 0) { settings.periodLength = num; }
            else { settings.cycleLength = num; }
            Storage.set('periodSettings', settings);
            steps = [{ label:'解析数值：'+num+'天', ok:true }, { label:'写入 periodSettings', ok:true }, { label:'重算经期预测', summary:'智能算法已启动', ok:true }];
            planStepCount = 3; reflectBar = '⚙️ 设置已更新！';
            reply = `⚙️ 已更新设置！${text.indexOf('经期') >= 0 ? '经期' : '周期'}已改为 ${num} 天。`;
          } else {
            reply = '⚙️ 请告诉我具体天数，比如「把周期改成30天」';
          }
        } else if (text.indexOf('清空') >= 0) {
          Storage.set('cart', []);
          steps = [{ label:'清空购物车 Storage', ok:true }];
          reply = '🗑️ 购物车已清空！';
        } else {
          steps = [{ label:'理解用户意图', summary:'H5 Agent 能力有限', ok:true }, { label:'建议替代方案', summary:'引导到对应页面', ok:true }];
          reply = '我理解你的需求了，但当前 H5 版本 Agent 能力有限。你可以试试：\n\n• 「帮我加3款卫生巾到购物车」\n• 「我今天来月经了」\n• 「把周期改成30天」';
        }

        state.agentMessages[state.agentMessages.length - 1] = {
          id: traceId, role:'assistant', type:'trace', traceTitle:'Agent 执行完成', pending:false,
          planStepCount, reflectCount, memoryCount, executionLabel:'1.5s',
          steps, reflectBarText: reflectBar, actionButtons
        };
        state.agentMessages.push({ role:'assistant', content:reply, actionButtons });
        state.isAgentLoading = false;
        render();
      }
    }, 1200);
  }

  function recordOnChain() {
    const daily = Storage.get('dailyPeriodRecords') || {};
    const diary = Storage.get('diary') || {};
    const records = Storage.get('blockchainRecords') || [];
    const hash = '0x' + Array.from({length:40}, () => Math.floor(Math.random()*16).toString(16)).join('');
    records.unshift({
      block_index: records.length + 1,
      block_hash: hash,
      previous_hash: records[0]?.block_hash || '0x0000',
      record_type: 'health',
      data_summary: `经期${Object.keys(daily).length}条，日记${Object.keys(diary).length}篇`,
      created_at: new Date().toISOString()
    });
    Storage.set('blockchainRecords', records);
    Utils.toast('已上链存证 ✅'); render();
  }

  function verifyChain() {
    const records = Storage.get('blockchainRecords') || [];
    if (records.length === 0) { Utils.toast('暂无存证记录'); return; }
    state.verifyResult = { allValid: true, results: records.map(r => ({ blockIndex: r.block_index, valid: true })) };
    state.showVerifyModal = true; render();
  }

  if (state.messages.length === 0) {
    state.messages.push({ role:'assistant', content:'你好！我是小暖AI助手，有什么健康问题都可以问我~ 💗', time: fmtTime() });
  }

  render();
});

</script>
<script>
// ===== Me Page - 个人中心 =====
Router.register('me', function(root, params) {
  function getUser() {
    try { return JSON.parse(localStorage.getItem('userProfile') || 'null'); } catch (e) { return null; }
  }
  function isLoggedIn() { return !!localStorage.getItem('token'); }

  function render() {
    const user = getUser();
    const logged = isLoggedIn();
    const favorites = Storage.get('favorites') || [];
    const cart = Storage.get('cart') || [];
    const diary = Storage.get('diary') || {};

    const nick = user ? (user.nickname || user.username || '小暖用户') : '未登录';
    const avatar = user && user.avatarUrl ? user.avatarUrl : 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><circle cx="40" cy="40" r="40" fill="%23ffb6c1"/><text x="40" y="52" font-size="28" text-anchor="middle" fill="%23fff">🌸</text></svg>';

    root.innerHTML = `
      <div class="me-page">
        <div class="me-header">
          <div class="me-avatar"><img src="${avatar}"/></div>
          <div class="me-user-info">
            <div class="me-nick">${nick}</div>
            <div class="me-id">ID: u${Storage.getCurrentUserId().slice(0,8)}</div>
          </div>
          ${logged ? '' : '<button class="me-login-btn" data-action="login">登录 / 注册</button>'}
        </div>
        <div class="me-stats">
          <div class="me-stat-item" data-action="favorites">
            <div class="me-stat-num">${favorites.length}</div><div class="me-stat-lbl">我的收藏</div>
          </div>
          <div class="me-stat-item" data-action="cart">
            <div class="me-stat-num">${cart.length}</div><div class="me-stat-lbl">购物车</div>

          login: showLoginDialog,
          logout: () => { Utils.modal({ title:'确认退出？', content:'退出后本地数据仍保留', showCancel:true, confirmText:'退出', onConfirm:()=>{ Storage.fullLogout(); Utils.toast('已退出'); render(); }}); },
          favorites:'favorites', cart:'cart', records:'records', report:'report', care:'care', settings:'settings', feedback:'feedback', about:'about', 'diary-tab':()=>Router.goTab('diary')
        };
        const target = map[a];
        if (typeof target === 'function') target();
        else if (target) Router.go(target);
      };
    });
  }

  function showLoginDialog() {
    Utils.modal({
      title: '登录 / 注册',
      content: `
        <div style="padding:10px 0">
          <input id="loginUser" placeholder="手机号/用户名" style="width:100%;padding:10px;border:1px solid #eee;border-radius:8px;margin-bottom:10px;box-sizing:border-box"/>
          <input id="loginPwd" type="password" placeholder="密码" style="width:100%;padding:10px;border:1px solid #eee;border-radius:8px;margin-bottom:10px;box-sizing:border-box"/>
          <button id="btnDevLogin" style="width:100%;padding:10px;background:#ffb6c1;color:#fff;border:none;border-radius:8px;margin-top:6px">🛠️ 开发登录（快速体验）</button>
          <button id="btnRealLogin" style="width:100%;padding:10px;background:#ff5f8f;color:#fff;border:none;border-radius:8px;margin-top:6px">正式登录</button>
        </div>`,
      showCancel: true, cancelText: '取消', confirmText: '注册',
      onConfirm: () => {
        const u = document.getElementById('loginUser').value;
        const p = document.getElementById('loginPwd').value;
        if (!u || !p) { Utils.toast('请填写完整'); return; }
        Utils.modal({ title:'注册中...', content:'后端未启动，已为你创建本地虚拟账号', showCancel:false, confirmText:'好的' });
        finishLogin({ userId:'local_'+Date.now(), nickname: u, username: u });
      }
    });
    setTimeout(() => {
      document.getElementById('btnDevLogin').onclick = () => {
        finishLogin({ userId:'dev_'+Math.floor(Math.random()*1000), nickname:'小暖开发者', username:'dev'});
      };
      document.getElementById('btnRealLogin').onclick = async () => {
        const u = document.getElementById('loginUser').value;
        const p = document.getElementById('loginPwd').value;
        if (!u || !p) { Utils.toast('请填写完整'); return; }
        try {
          const res = await Api.login({ username:u, password:p });
          if (res.token) { Api.setToken(res.token); finishLogin(res.user || { nickname:u }); }
          else Utils.toast(res.message || '登录失败');
        } catch (e) {
          Utils.toast('后端未启动，已为你创建本地虚拟账号');
          finishLogin({ userId:'local_'+Date.now(), nickname: u, username: u });
        }
      };
    }, 50);
  }

  function finishLogin(user) {
    localStorage.setItem('userProfile', JSON.stringify(user));
    if (!localStorage.getItem('token')) localStorage.setItem('token', 'wx_local_' + Date.now());
    Utils.toast('登录成功 💗');
    render();
  }

  render();
});

</script>
<script>
// ===== Symptoms Page =====
Router.register('symptoms', function(root, params) {

  root.innerHTML = `
    <div style="padding:16px">
      <div style="font-size:13px;color:#999;margin-bottom:10px">选择你经历的症状（可多选）</div>

      <div style="margin-top:24px;display:flex;gap:10px">

<script>
// ===== Product Detail Page =====
Router.register('product', function(root, params) {
  const product = Catalog.PRODUCTS.find(p => String(p.id) === String(params.id)) || Catalog.PRODUCTS[0];
  if (!product) { root.innerHTML = '<div style="padding:40px;text-align:center;color:#999">商品不存在</div>'; return; }

  const GRADIENTS = [['#ff9a9e','#fad0c4'],['#a18cd1','#fbc2eb'],['#a6c1ee','#c2e9fb'],['#84fab0','#8fd3f4'],['#fccb90','#d57eeb']];
  const h = (product.brand || product.name || '品').split('').filter(c => /[\u4e00-\u9fa5A-Za-z]/.test(c)).join('').charAt(0);
  const g = GRADIENTS[Math.abs(hashStr(product.brand || product.name || '1')) % GRADIENTS.length];

  function hashStr(s) { let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }

  function isFav() {
    const favs = Storage.get('favorites') || [];
    return favs.findIndex(f => f.id === product.id) >= 0;
  }

  root.innerHTML = `
    <div class="product-detail">
      <div class="pd-media">
        ${product.image ? `<img src="${product.image}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='<div class=\\'pd-ph\\' style=\\'width:100%;height:100%;background:linear-gradient(135deg,${g[0]},${g[1]})\\'><span class=\\'p-ph-char\\' style=\\'font-size:60px;color:#fff\\'>${h || '品'}</span><div class=\\'p-ph-brand\\'>${product.brand}</div></div>'">`
          : `<div class="pd-ph" style="width:100%;height:100%;background:linear-gradient(135deg,${g[0]},${g[1]})"><span class="p-ph-char" style="font-size:60px;color:#fff">${h || '品'}</span><div class="p-ph-brand">${product.brand}</div></div>`}
      </div>
      <div class="pd-info">
        <div class="pd-price-row">
          <span class="pd-price"><span class="yen">¥</span>${product.price.toFixed(1)}</span>
          <span class="pd-original" style="text-decoration:line-through;color:#aaa">¥${(product.price * 1.3).toFixed(1)}</span>
        </div>
        <div class="pd-title">${product.name}</div>
        <div class="pd-brand">${product.brand} · ${product.subCategory}</div>
        <div class="pd-tags">${(product.features||[]).map(f=>'<span class="pd-tag">'+f+'</span>').join('')}</div>
        <div class="pd-meta">
          <span class="pd-rating">★ ${product.rating}</span>
          <span class="pd-sales">${Catalog.formatSales(product.sales)}人付款</span>
        </div>
      </div>
      ${product.description ? `<div class="pd-desc"><div class="pd-desc-title">商品介绍</div><div class="pd-desc-content">${product.description}</div></div>` : ''}
      <div class="pd-specs">
        <div class="pd-desc-title">规格参数</div>
        ${product.specs ? Object.entries(product.specs).map(([k,v])=>`<div class="spec-row"><span class="spec-key">${k}</span><span class="spec-val">${v}</span></div>`).join('') : `<div class="spec-row"><span class="spec-key">品牌</span><span class="spec-val">${product.brand}</span></div>
          <div class="spec-row"><span class="spec-key">分类</span><span class="spec-val">${product.category}</span></div>
          <div class="spec-row"><span class="spec-key">子分类</span><span class="spec-val">${product.subCategory}</span></div>`}
      </div>
      <div class="pd-guarantee">
        ✅ 正品保证 &nbsp; · &nbsp; 🚚 顺丰包邮 &nbsp; · &nbsp; ↩️ 7天无忧退换
      </div>

      <div class="pd-footer">
        <div class="pd-bottom-icon ${isFav()?'fav-on':''}" id="btnFav">
          <span>${isFav()?'❤️':'🤍'}</span><span>${isFav()?'已收藏':'收藏'}</span>
        </div>
        <button class="pd-add-cart" id="btnAddCart">加入购物车</button>
        <button class="pd-buy-now" id="btnBuyNow">立即购买</button>
      </div>
    </div>
  `;

  document.getElementById('btnFav').onclick = () => {
    const favs = Storage.get('favorites') || [];
    const idx = favs.findIndex(f => f.id === product.id);
    if (idx >= 0) { favs.splice(idx,1); Utils.toast('已取消收藏'); }
    else { favs.unshift({ id:product.id, brand:product.brand, name:product.name, price:String(product.price), addedTime:Date.now() }); Utils.toast('已收藏 ❤️'); }
    Storage.set('favorites', favs);
    Router._handle();
  };
  document.getElementById('btnAddCart').onclick = () => {
    const cart = Storage.get('cart') || [];
    const exist = cart.find(c => c.id === product.id);
    if (exist) exist.quantity = (exist.quantity||1) + 1;
    else cart.push({ id:product.id, brand:product.brand, name:product.name, price:String(product.price), quantity:1, checked:true, addedTime:Date.now() });
    Storage.set('cart', cart);
    Utils.toast('已加入购物车 🛒');
  };
  document.getElementById('btnBuyNow').onclick = () => {
    const cart = Storage.get('cart') || [];
    cart.push({ id:product.id, brand:product.brand, name:product.name, price:String(product.price), quantity:1, checked:true, addedTime:Date.now() });
    Storage.set('cart', cart);
    Router.go('cart');
  };
});

</script>
<script>
// ===== Cart Page =====
Router.register('cart', function(root, params) {
  function render() {
    const cart = Storage.get('cart') || [];
    const total = cart.filter(c => c.checked).reduce((s,c) => s + parseFloat(c.price) * c.quantity, 0);
    const totalCount = cart.reduce((s,c) => s + c.quantity, 0);
    const allChecked = cart.length > 0 && cart.every(c => c.checked);

    root.innerHTML = `
      <div style="padding:12px">
        ${cart.length === 0 ? `<div style="text-align:center;padding:60px 20px;color:#999">
          <div style="font-size:48px">🛒</div>
          <div style="margin-top:10px">购物车空空如也~</div>
          <button class="btn" style="margin-top:16px;background:#ff5f8f;color:#fff" onclick="Router.goTab('health')">去逛逛</button>
        </div>` : `
        <div class="cart-list">
          ${cart.map((c,idx) => `<div class="cart-item">
            <div class="cart-check ${c.checked?'on':''}" data-toggle="${idx}">${c.checked?'✓':''}</div>
            <div class="cart-thumb">🌸</div>
            <div class="cart-info" style="flex:1">
              <div class="cart-name">${c.name}</div>
              <div class="cart-brand">${c.brand}</div>
              <div class="cart-bottom">
                <span class="cart-price"><span class="yen">¥</span>${parseFloat(c.price).toFixed(1)}</span>
                <div class="qty-ctrl">
                  <button class="qty-btn" data-act="minus" data-idx="${idx}">-</button>
                  <span>${c.quantity}</span>
                  <button class="qty-btn" data-act="plus" data-idx="${idx}">+</button>
                  <button class="cart-del" data-idx="${idx}" style="margin-left:8px;color:#999;font-size:14px">🗑️</button>
                </div>
              </div>
            </div>
          </div>`).join('')}
        </div>
        <div style="height:70px"></div>
        <div class="cart-footer">
          <label class="cart-all-check"><input type="checkbox" id="allCheck" ${allChecked?'checked':''} style="accent-color:#ff5f8f"> 全选</label>
          <div class="cart-total">合计 <span class="cart-total-num">¥${total.toFixed(2)}</span></div>
          <button class="cart-checkout" ${cart.length===0?'disabled':''} id="checkoutBtn">结算(${cart.filter(c=>c.checked).length})</button>
        </div>`}
      </div>
    `;

    root.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => {
      const i = parseInt(b.dataset.toggle); cart[i].checked = !cart[i].checked; Storage.set('cart', cart); render();
    });
    root.querySelectorAll('.qty-btn').forEach(b => b.onclick = () => {
      const i = parseInt(b.dataset.idx); const act = b.dataset.act;
      if (act === 'minus' && cart[i].quantity > 1) cart[i].quantity--;
      else if (act === 'plus') cart[i].quantity++;
      Storage.set('cart', cart); render();
    });
    root.querySelectorAll('.cart-del').forEach(b => b.onclick = () => {
      cart.splice(parseInt(b.dataset.idx), 1); Storage.set('cart', cart); render();
    });
    const allChk = document.getElementById('allCheck');
    if (allChk) allChk.onchange = () => {
      cart.forEach(c => c.checked = allChk.checked); Storage.set('cart', cart); render();
    };
    const co = document.getElementById('checkoutBtn');
    if (co) co.onclick = () => {
      const selected = cart.filter(c => c.checked);
      if (selected.length === 0) return Utils.toast('请选择商品');
      Utils.modal({ title:'确认下单？', content:`共 ${selected.length} 件商品，合计 ¥${total.toFixed(2)}<br><br>H5版暂未接入真实支付，已模拟下单成功~`, confirmText:'支付 ¥'+total.toFixed(2), onConfirm:()=>{
        const ids = selected.map(c => c.id);
        const newCart = cart.filter(c => !ids.includes(c.id));
        Storage.set('cart', newCart);
        Utils.toast('下单成功 🎉'); render();
      }});
    };
  }
  render();
});

</script>

// ===== Report Page =====
Router.register('report', function(root, params) {
  const daily = Storage.get('dailyPeriodRecords') || {};
  const diary = Storage.get('diary') || {};
  const pdDates = Object.keys(daily).filter(k => daily[k] && daily[k].status === 1).sort();
  const settings = Storage.get('periodSettings') || {};
  const cLen = settings.cycleLength || 28;

  let avgCycle = cLen, irregularity = '规律';
  if (pdDates.length >= 2) {
    const diffs = [];
    for (let i=1; i<pdDates.length; i++) diffs.push(Math.round((new Date(pdDates[i]) - new Date(pdDates[i-1]))/86400000));
    if (diffs.length) avgCycle = Math.round(diffs.reduce((a,b)=>a+b,0)/diffs.length);
    if (diffs.length >= 2) {
      const m = diffs.reduce((a,b)=>a+b,0)/diffs.length;
      const sd = Math.sqrt(diffs.reduce((s,v)=>s+Math.pow(v-m,2),0)/diffs.length);
      irregularity = sd > 8 ? '不规律 ⚠️' : sd > 4 ? '基本规律' : sd > 2 ? '比较规律' : '非常规律 🎉';
    }
  }

  const today = new Date();
  const moodDist = {};
  Object.values(diary).forEach(d => { if (d && d.mood) moodDist[d.mood] = (moodDist[d.mood]||0)+1; });
  const topMood = Object.entries(moodDist).sort((a,b)=>b[1]-a[1])[0] || ['暂无心情记录', 0];

  const suggestions = [];
  if (irregularity.indexOf('不规律') >= 0) suggestions.push('您的周期波动较大，建议保持规律作息、减轻压力，如持续不规律建议就医检查。');
  if (pdDates.length === 0) suggestions.push('您还没有记录经期哦，开始记录吧！');
  if (pdDates.length > 0 && new Date(pdDates[pdDates.length-1]) < new Date(today.getTime() - avgCycle * 86400000 * 1.5)) suggestions.push('距上次经期时间较长，如有不适建议检查。');
  if (topMood[0] === '难过' || topMood[0] === '焦虑') suggestions.push('检测到您近期情绪偏低，要照顾好自己哦 💗。');
  if (suggestions.length === 0) suggestions.push('您的身体状态整体良好，继续保持！');

  root.innerHTML = `
    <div style="padding:12px">
      <div class="report-hero">
        <div class="rh-title">🩺 AI 健康洞察报告</div>
        <div class="rh-date">报告生成时间：${Utils.fmtDate(new Date())}</div>
      </div>

      <div class="report-section">
        <div class="rs-title">📈 经期数据</div>
        <div class="rs-grid">
          <div class="rs-cell"><div class="rs-num">${pdDates.length}</div><div class="rs-lbl">经期记录天</div></div>
          <div class="rs-cell"><div class="rs-num">${avgCycle}</div><div class="rs-lbl">平均周期(天)</div></div>
          <div class="rs-cell"><div class="rs-num">${Object.keys(diary).length}</div><div class="rs-lbl">心情日记</div></div>
        </div>
        <div class="rs-row">周期状态：${irregularity}</div>
        <div class="rs-row">今日阶段：${(function(){
          const today2 = new Date(); const last = pdDates.length ? new Date(pdDates[pdDates.length-1]) : today2;
          const since = Math.ceil((today2-last)/86400000);
          if (pdDates.length === 0) return '未知';
          if (since <= 7) return '经期';
          if (since <= 12) return '卵泡期';
          if (since <= 20) return '排卵期';
          return '黄体期';
        })()}</div>
      </div>

      <div class="report-section">
        <div class="rs-title">💭 情绪洞察</div>
        ${Object.keys(moodDist).length === 0 ? '<div style="color:#999;font-size:13px">暂无心情日记，请记录后获得更精准分析</div>' :
          Object.entries(moodDist).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([m,c])=>{
            const max = topMood[1];
            const w = Math.round(c/max*100);
            return `<div style="display:flex;align-items:center;margin:4px 0;gap:8px"><span style="width:48px;font-size:12px">${m}</span><div style="flex:1;background:#f5f5f5;border-radius:8px;height:12px"><div style="background:linear-gradient(90deg,#ffb6c1,#ff5f8f);width:${w}%;height:100%;border-radius:8px"></div></div><span style="font-size:12px;color:#888;width:32px;text-align:right">${c}篇</span></div>`;
          }).join('')}
      </div>

      <div class="report-section">
        <div class="rs-title">💡 AI 健康建议</div>
        ${suggestions.map(s => `<div class="ai-card" style="border-left:3px solid #ff5f8f;margin-bottom:8px"><div>${s}</div></div>`).join('')}
        <div style="margin-top:10px;padding:10px;background:#fff5d6;border-radius:8px;font-size:12px;color:#a07400">
          ⚠️ 本报告由 AI 生成，仅供参考学习。如有不适症状请及时就医，不要替代专业诊断。
        </div>
      </div>

      <button class="btn" style="width:100%;background:#ff5f8f;color:#fff;margin-top:12px" onclick="Utils.toast('已复制到剪贴板'); Utils.copyText(document.body.innerText)">📤 分享报告</button>
      <button class="btn" style="width:100%;background:#fff;margin-top:6px;border:1px solid #ff5f8f;color:#ff5f8f" onclick="Router.goTab('ai')">💬 向小暖提问</button>
    </div>
  `;
});
