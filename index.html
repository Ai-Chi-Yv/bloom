<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Herbloom 女性健康管家</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <!-- 顶部导航栏 -->
  <header class="nav-bar" id="navBar">
    <button class="nav-back" id="navBack" style="display:none">‹</button>
    <h1 class="nav-title" id="navTitle">经期记录</h1>
    <button class="nav-action" id="navAction" style="display:none"></button>
  </header>

  <!-- 页面内容区 -->
  <main id="pageContainer"></main>

  <!-- 底部 TabBar -->
  <nav class="tab-bar" id="tabBar">
    <button class="tab-item active" data-tab="period">
      <span class="tab-icon">📅</span>
      <span class="tab-text">经期记录</span>
    </button>
    <button class="tab-item" data-tab="health">
      <span class="tab-icon">🛍️</span>
      <span class="tab-text">健康防护</span>
    </button>
    <button class="tab-item" data-tab="diary">
      <span class="tab-icon">💭</span>
      <span class="tab-text">心情日记</span>
    </button>
    <button class="tab-item" data-tab="ai">
      <span class="tab-icon">🤖</span>
      <span class="tab-text">AI助手</span>
    </button>
    <button class="tab-item" data-tab="me">
      <span class="tab-icon">👤</span>
      <span class="tab-text">个人中心</span>
    </button>
  </nav>

  <!-- Toast -->
  <div id="toast" class="toast" style="display:none"></div>
  <!-- Modal -->
  <div id="modal" class="modal" style="display:none">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-content" id="modalContent"></div>
      <div class="modal-actions">
        <button class="modal-cancel" id="modalCancel">取消</button>
        <button class="modal-confirm" id="modalConfirm">确定</button>
      </div>
    </div>
  </div>

  <!-- AI 悬浮按钮 -->
  <div id="aiFloat" class="ai-float" style="display:none">
    <span class="ai-float-icon">💗</span>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/router.js"></script>
<script src="pages/period.js"></script>
<script src="pages/health.js"></script>
<script src="pages/diary.js"></script>
<script src="pages/ai.js"></script>
<script src="pages/me.js"></script>
<script src="pages/symptoms.js"></script>
<script src="pages/settings.js"></script>
<script src="pages/product.js"></script>
<script src="pages/cart.js"></script>
<script src="pages/extra.js"></script>
<script src="js/app.js"></script>
</body>
</html>
